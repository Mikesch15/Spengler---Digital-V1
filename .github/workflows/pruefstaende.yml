name: Prüfstände

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefstaende:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright-Core und SheetJS installieren
        # SheetJS wird von den beiden Excel-Import-Pruefstaenden gebraucht.
        # Ohne das Paket liefen deren Datei-Teile in der CI nie mit.
        run: npm install playwright-core@latest xlsx --no-save

      - name: Chromium installieren
        run: npx playwright-core install --with-deps chromium

      - name: Alle Prüfstände laufen lassen
        env:
          SP: ${{ github.workspace }}
        run: node pruefstaende/ci-lauf.js
