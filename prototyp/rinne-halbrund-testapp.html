<style>
/* ---- css/01-basis.css (unverändert aus der laufenden App) ---- */
*{box-sizing:border-box}
:root{--blue:#1769aa;--blue-dark:#0f5288;--blue-light:#eaf4fa;--ink:#17242d;--muted:#6b7880;--line:#cbd4d9;--bg:#eef2f6;--green:#16845c;--green-dark:#0f6847;--red:#b42318;--red-light:#fff0ef;--card-bg:#fff;--card-line:#e2e8ec;--input-bg:#fff}
html.dark{--ink:#e7edf1;--muted:#93a1a9;--line:#33424c;--bg:#141c22;--blue-light:#1c3546;--red-light:#3a1f1d;--card-bg:#1c262e;--card-line:#2a3841;--input-bg:#202b33}
html.dark body{background:linear-gradient(180deg,#171f26,#141c22 240px,var(--bg) 480px)}
html.dark .modal{background:linear-gradient(180deg,#171f26,#141c22 240px,var(--bg) 480px)}
html.dark .card{background:var(--card-bg);border-color:var(--card-line)}
html.dark input,html.dark select,html.dark textarea{background:var(--input-bg);color:var(--ink);border-color:var(--line)}
html.dark .settingrow-mat,html.dark .sketch-thumb-wrap{background:var(--card-bg);border-color:var(--card-line)}
html.dark .mat-row-head{background:transparent}
html.dark th{background:#0e161c!important}
body{margin:0;background:linear-gradient(180deg,#f2f5f8,#e8edf1 240px,var(--bg) 480px);background-attachment:fixed;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:920px;margin:auto;padding:14px 9px 40px}
.brand{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--blue)}
h1{font-size:28px;margin:3px 0 14px;color:var(--ink);letter-spacing:-.01em}
h2{font-size:13px;margin:0 0 12px;padding-bottom:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-dark);border-bottom:2px solid var(--blue-light)}
.card{background:#fff;border:1px solid #e2e8ec;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 2px #17242d0a,0 10px 24px -8px #17242d1f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}
label{display:block;font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
input,select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #1769aa26}
input::placeholder,textarea::placeholder{color:#9aa7ae}
textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.blue{background:var(--blue);color:#fff;box-shadow:0 2px 8px #1769aa40}.blue:hover{background:var(--blue-dark)}
.green{background:var(--green);color:#fff;box-shadow:0 2px 8px #16845c40}.green:hover{background:var(--green-dark)}
.gray{background:#e8eef1;color:var(--ink)}.gray:hover{background:#dde6ea}
.red{background:#fff0ef;color:var(--red)}.red:hover{background:#ffe3e1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* Ohne diese Regel schlaegt .bar{display:flex} das [hidden] des Browsers
   und eine versteckte Leiste bleibt sichtbar (Lehre aus Abschnitt 59). */
.bar[hidden]{display:none}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1000px;table-layout:fixed}
/* Spaltenbreiten in der App, abgestimmt auf den tatsächlichen Inhalt je Spalte.
   Pos. wird unten für den Bildschirm zusätzlich fix auf 23mm gesetzt (gleich wie im PDF). */
.work-table col.c-pos{width:7%}.work-table col.c-desc{width:54%}.work-table col.c-emp{width:5.5%}.work-table col.c-func{width:8.5%}.work-table col.c-std{width:5%}.work-table col.c-rate{width:7%}.work-table col.c-total{width:8.5%}.work-table col.c-del{width:4.5%}
.mat-table col.m-pos{width:7%}.mat-table col.m-edv{width:11%}.mat-table col.m-material{width:43%}.mat-table col.m-dim{width:6.5%}.mat-table col.m-unit{width:6%}.mat-table col.m-qty{width:6%}.mat-table col.m-price{width:7.5%}.mat-table col.m-total{width:8%}.mat-table col.m-del{width:5%}
.work-table td:last-child,.work-table th:last-child,.mat-table td:last-child,.mat-table th:last-child{text-align:left}
.work-table td:last-child button,.mat-table td:last-child button{padding:6px 9px}
input[type=date]{font-size:11px;padding-left:4px;padding-right:2px;width:100%;min-width:0}
#workBody input[type=date],#matBody input[type=date]{width:100%;display:block;box-sizing:border-box}
th{background:#f2f6f8;text-align:left;font-size:9px;padding:9px 6px;color:var(--muted);font-weight:800;letter-spacing:.03em}
td{border-top:1px solid var(--line);padding:6px;font-size:12px;vertical-align:middle}
tbody tr:hover td{background:#f7fafc}
td input,td select{min-height:34px;font-size:12px}
.money{text-align:left;font-variant-numeric:tabular-nums}
.money input.mat-preis{text-align:left;font-variant-numeric:tabular-nums}
.print-only{display:none}
.total{text-align:right;font-size:20px;font-weight:900;margin-top:10px;background:var(--blue-light);color:var(--blue-dark);border-radius:10px;padding:10px 12px}
.small{font-size:11px;color:var(--muted);margin-top:7px}
.search{position:relative}
/* Leere Vorschlagsbox ausblenden – sonst bleibt ihr Rahmen als feiner
   Strich quer über dem Bildschirm stehen. */
.suggest:empty{display:none}
.suggest{position:fixed;z-index:1000;min-width:320px;max-width:min(92vw,560px);background:#fff;border:1px solid #bcc9d0;border-radius:10px;box-shadow:0 14px 28px #17242d26;max-height:260px;overflow:auto}
.item{white-space:normal;line-height:1.25}
.item{padding:10px;border-bottom:1px solid #edf0f2;cursor:pointer;transition:background .1s}.item:last-child{border-bottom:0}.item:hover{background:var(--blue-light)}.item b{display:block}.item span{font-size:11px;color:var(--muted)}
/* Projektvorschlag (v2.48): Adresse als Hauptinformation, darf ueber
   mehrere Zeilen umbrechen; Trefferflaeche gross genug fuer den Daumen. */
.projekt-vorschlag{min-height:48px;padding:9px 10px}
.projekt-vorschlag b{font-size:13px;word-break:break-word}
.projekt-vorschlag span{display:block;margin-top:2px;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:12px;border:1px dashed var(--line);border-radius:10px;background:#fbfcfd}
.modal{position:fixed;inset:0;background:linear-gradient(180deg,#f2f5f8,#e8edf1 240px,var(--bg) 480px);background-attachment:fixed;z-index:500;padding:14px 9px 40px;overflow:auto;animation:fadeIn .15s ease-out}.modalbox{max-width:920px;margin:auto;padding:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settingrow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;margin:6px 0;display:grid;grid-template-columns:1.3fr .9fr auto;gap:8px;align-items:center}
.settingrow.emp-row{grid-template-columns:1fr auto}
.settings-section{border:1px solid #dfe6ea;border-radius:12px;margin:12px 0;overflow:hidden}
.settings-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;cursor:pointer;background:var(--blue-light)}
.settings-section-head h2{margin:0;padding:0;border:0;color:var(--blue-dark)}
.settings-section-chevron{flex:0 0 auto;font-size:18px;font-weight:900;color:var(--blue);transition:transform .15s}
.settings-section.open .settings-section-chevron{transform:rotate(90deg)}
.settings-section-body{display:none;padding:12px 14px}
.settings-section.open .settings-section-body{display:block}
.settings-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid #e2e8ec;margin:8px 0 16px}
.settings-tab{background:none;color:var(--muted);padding:9px 14px;border-radius:9px 9px 0 0;font-weight:800;font-size:12.5px;box-shadow:none}
.settings-tab:hover{background:#f2f5f8}
.settings-tab.active{background:var(--blue-light);color:var(--blue-dark)}
.settingrow-mat{background:#fff;border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}
.mat-row-head{display:flex;align-items:center;gap:8px;padding:7px;cursor:pointer}
.mat-row-head .mat-nr{flex:0 0 30%;min-width:0}
.mat-row-head .mat-name{flex:1 1 auto;min-width:0}
.mat-chevron{flex:0 0 20px;text-align:center;color:var(--muted);font-size:16px;font-weight:900;transition:transform .15s}
.settingrow-mat.open .mat-chevron{transform:rotate(90deg);color:var(--blue)}
.mat-row-body{display:none;grid-template-columns:1fr 1fr 1fr auto;align-items:end;gap:7px;padding:0 7px 9px}
.mat-row-body label{font-size:8px}
.settingrow-mat.open .mat-row-body{display:grid}
.settingrow-mat.open .mat-row-head{border-bottom:1px solid #eef1f3;background:var(--blue-light)}
.cut{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.cutgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.area{background:var(--blue-light);color:var(--blue-dark);border-radius:9px;padding:9px;font-weight:800}
.project-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:6px 0}
.project-row .project-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.project-row .project-row-top b{font-size:15px;flex:1 1 auto;min-width:0;word-break:break-word}
.project-row .small{margin-top:3px;word-break:break-word}
/* v2.47: Status auf eigener Zeile - so verdraengt das Badge nie den
   Titel und die Karte laeuft auf dem Handy nicht seitlich hinaus. */
.project-row-status{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.pstatus-archiv{color:var(--muted)}
.project-row-archiviert{opacity:.72}
/* Hauptaktion: volle Breite, gross genug fuer den Daumen. */
.project-row-main{display:block;width:100%;min-height:44px;margin-top:9px;text-align:center;font-size:13px}
.project-row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.project-row-actions button{flex:1 1 auto;min-height:38px;padding:6px 10px;font-size:11px}
.report-list{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:none}
.report-list.open{display:block}
.report-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--blue-light);border-radius:8px;padding:7px 9px;margin:5px 0}
.report-row .report-row-info{flex:1 1 190px;min-width:0}
.report-row .report-row-info b{display:block;font-size:12px;word-break:break-word}
/* Objektadresse als Haupttitel im Regierapport-Bildschirm (v2.44) */
.report-adresse{font-size:15px;font-weight:800;color:var(--ink);margin:-6px 0 10px;word-break:break-word}
/* Projektdateien (v2.43): Bildvorschau bzw. Typ-Symbol vor der Zeile */
.datei-thumb{flex:0 0 auto;width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.datei-icon{flex:0 0 auto;width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}
/* Dateizeile im Projekt-Cockpit (v2.49): Name gross, darunter Typ/Groesse
   und Datum; die Aktionen brechen auf schmalen Geraeten um und sind gross
   genug fuer den Daumen. */
.datei-row .report-row-info b{font-size:13px}
.datei-row .report-row-actions{flex:1 1 100%;flex-wrap:wrap;margin-top:2px}
.datei-row .report-row-actions button{flex:1 1 auto;min-height:40px}
.datei-row .report-row-actions button.blue{min-height:44px;flex:1 1 100%}
/* Medien-Hinweis in der Massaufnahme-Zeile (v2.50) */
.meas-medien-hinweis{color:var(--blue-dark)!important;font-weight:800}
/* Galerie der Fotos/Skizzen einer Massaufnahme (v2.50): grosse, gut
   antippbare Kacheln, die auf schmalen Geraeten umbrechen. */
.medien-galerie{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.medien-kachel{flex:1 1 140px;max-width:200px;min-height:130px;padding:0;background:#fff;
 border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;
 flex-direction:column;align-items:stretch;cursor:pointer}
.medien-kachel img{width:100%;height:110px;object-fit:cover;background:var(--blue-light);display:block}
.medien-label{display:block;padding:6px 8px;font-size:11px;font-weight:800;color:var(--muted);text-align:left}
.medien-fehler{display:flex;align-items:center;justify-content:center;height:110px;padding:8px;
 font-size:11px;font-weight:700;color:var(--muted);background:var(--blue-light);text-align:center}
/* Grosse Ansicht eines einzelnen Bildes (v2.50) */
.medien-viewer{position:fixed;inset:0;z-index:900;background:#0d141aee;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.medien-viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
 width:100%;max-width:920px;color:#fff;font-size:12px;font-weight:800}
.medien-viewer-bar button{min-height:44px}
.medien-viewer img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:10px;background:#fff}
/* WICHTIG: Eine Klasse mit display:… schlaegt die Browserregel
   [hidden]{display:none}. Ohne diese Zeile bleibt die Vollbildansicht
   dauerhaft ueber der ganzen App liegen (Fehler aus v2.50).
   Gleiches Muster wie .sketch-fullscreen[hidden] weiter unten. */
.medien-viewer[hidden]{display:none}
/* Arbeitsstand im Projekt-Cockpit (v2.42): kompakte Zeilen, nur Fakten */
.arbeitsstand{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden;background:#fff}
.arbeitsstand-titel{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
.arbeitsstand-zeile{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border-top:1px solid #eef1f3;border-radius:0;padding:9px 10px;min-height:38px;font-weight:600;color:var(--ink)}
button.arbeitsstand-zeile{cursor:pointer}
button.arbeitsstand-zeile:hover{background:var(--blue-light)}
.arbeitsstand-marke{flex:0 0 auto;width:16px;text-align:center;font-size:12px;font-weight:900;color:var(--blue)}
.arbeitsstand-name{flex:1 1 auto;min-width:0;font-size:12px;word-break:break-word}
.arbeitsstand-wert{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--blue-dark);text-align:right}
.arbeitsstand-aktivitaet .arbeitsstand-wert{font-weight:600;color:var(--muted)}
/* Schnellzugriff "Zuletzt bearbeitet" (v2.41): ganze Karte ist der Knopf */
.recent-project{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--blue-light);color:var(--blue-dark);border-radius:10px;padding:11px 12px;margin:6px 0;min-height:52px}
.recent-project-info{flex:1 1 auto;min-width:0}
.recent-project-info b{display:block;font-size:13px;word-break:break-word}
.recent-project-info span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;word-break:break-word}
.recent-project-arrow{flex:0 0 auto;font-size:18px;font-weight:900;color:var(--blue)}
/* Projektstatus (v2.46): Zeichen + Text + Farbe - nie die Farbe allein.
   Kompakt genug fuer die Projektkarte, gut lesbar auf dem Handy. */
.pstatus{display:inline-block;font-size:11px;font-weight:900;line-height:1.5;
 border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pstatus-offen{color:var(--muted)}
.pstatus-in_arbeit{color:var(--blue)}
.pstatus-abgeschlossen{color:var(--green)}
.pstatus-storniert{color:var(--red)}
html.dark .pstatus-abgeschlossen{color:#4cc79a}
html.dark .pstatus-storniert{color:#f08b80}
/* Statuszeile im Projektkopf: Anzeige und Auswahlfeld nebeneinander,
   auf schmalen Geraeten untereinander. */
.projekt-status-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 4px}
.projekt-status-zeile select{flex:0 1 200px;min-height:38px}
.projekt-status-anzeige{flex:0 0 auto}
/* Statusfilter der Projektliste: gleiche Chips wie im Verlauf (v2.31).
   margin-top ist Pflicht: die Leiste darueber (.bar) hat nur margin-top,
   sonst beruehren sich die beiden Knopfreihen ohne jede Luft (v2.69). */
.status-filter{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.status-filter button{padding:5px 9px;font-size:10.5px;background:var(--blue-light);color:var(--blue-dark);min-height:30px}
.status-filter button.aktiv{background:var(--blue);color:#fff}
.status-filter[hidden]{display:none}
/* Projektkopf im Cockpit (v2.45): die Adresse ist der Haupttitel und
   darf auf schmalen Geraeten umbrechen, statt seitlich hinauszulaufen. */
#cockpitTitle{word-break:break-word}
#cockpitSubline{word-break:break-word}
/* Projekt-Cockpit (v2.39): Abschnittsueberschrift mit Anzahl rechts,
   klar beschriftete Neu-Knoepfe ueber voller Breite. */
/* Aus der globalen Suche geoeffneter Treffer (v2.40): kurz hervorheben */
.report-row.treffer{outline:2px solid var(--blue);outline-offset:1px;background:#fff}
.cockpit-count{float:right;font-size:11px;font-weight:900;color:var(--blue);background:var(--blue-light);border-radius:999px;padding:1px 9px;min-width:20px;text-align:center}
.cockpit-new{display:block;width:100%;min-height:44px;text-align:center;line-height:24px}
label.cockpit-upload{cursor:pointer;border-radius:9px;padding:10px 13px;font-weight:800;font-size:12px}
.verlauf-filters button{padding:5px 9px;font-size:10.5px;background:var(--blue-light);color:var(--blue-dark)}
/* Sortier-Chips der Feedback-Liste - gleiche Optik wie die Verlauf-Filter */
.feedback-sort button{padding:6px 10px;font-size:11px;min-height:34px;background:var(--blue-light);color:var(--blue-dark)}
.feedback-sort button.active{background:var(--blue);color:#fff}
/* Auswahl der zu exportierenden Feedbacks: die ganze Kopfzeile ist das
   Label, damit auf dem Handy nicht das kleine Kaestchen getroffen werden
   muss. word-break, damit lange Modulnamen umbrechen statt zu ueberlaufen. */
label.feedback-pick{display:flex;align-items:flex-start;gap:9px;cursor:pointer;
 min-height:30px;padding:2px 0;margin:0}
label.feedback-pick input{width:19px;height:19px;min-height:0;flex:0 0 auto;margin:2px 0 0;padding:0;border:0;border-radius:0;accent-color:var(--blue)}
label.feedback-pick span{flex:1 1 auto;min-width:0;word-break:break-word;text-transform:none;letter-spacing:normal;font-weight:400;font-size:11px;margin:0}
.settingrow.feedback-gewaehlt{border-left:3px solid var(--blue)}
.verlauf-filters button.active{background:var(--blue);color:#fff}
.verlauf-entry{border-bottom:1px solid var(--line);padding:7px 2px}
.verlauf-entry:last-child{border-bottom:0}
.verlauf-entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.verlauf-entry-badges{display:flex;gap:5px;flex-wrap:wrap}
.verlauf-entry-entity{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.verlauf-entry-action{font-size:10.5px;font-weight:800;color:var(--blue-dark);background:var(--blue-light);border-radius:6px;padding:2px 7px;white-space:nowrap}
.verlauf-entry-who{font-size:12px;font-weight:700}
.verlauf-entry-desc{font-size:11px;color:var(--muted);margin-top:2px}
.verlauf-entry-changes{margin-top:4px;padding:6px 8px;background:var(--blue-light);border-radius:8px;font-size:11px;color:var(--ink)}
.verlauf-change-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 0}
.verlauf-change-label{font-weight:700;color:var(--blue-dark);white-space:nowrap}
.verlauf-change-value{word-break:break-word}
.verlauf-limit-hint{color:var(--muted);text-align:center}
.report-row .report-row-info span{display:block;font-size:11px;color:var(--muted);word-break:break-word}
.report-row .report-row-actions{display:flex;gap:6px;flex:0 0 auto}
.report-row button{padding:7px 10px;font-size:11px;min-height:34px}

.meas-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.eb-table{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.eb-diagram-box{background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.eb-diagram-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.eb-diagram-scroll svg{display:block}
.eb-table col.eb-col-pos{width:14%}
.eb-table col.eb-col-len{width:32%}
.eb-table col.eb-col-massa{width:26%}
.eb-table col.eb-col-side{width:28%}
.eb-table th{background:#f2f6f8;text-align:left;font-size:9px;padding:6px 5px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.eb-table td{border-top:1px solid var(--line);padding:5px;font-size:12px}
.eb-table td:first-child{text-align:left;color:var(--muted)}
.eb-table td:nth-child(2),.eb-table td:nth-child(3){text-align:left;font-variant-numeric:tabular-nums}
.eb-rest-row td{background:var(--blue-light);font-weight:800}
.start-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
.start-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 10px;border-radius:14px;font-size:14px;font-weight:800;text-align:center;line-height:1.3}
.start-nav-btn small{font-weight:600;font-size:10px;opacity:.85}
.start-nav-icon{font-size:34px;line-height:1}
#topUserBar{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:6px}
.report-topnav{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.report-topnav button{padding:7px 12px;font-size:12px}
@media(max-width:600px){.start-nav{grid-template-columns:1fr}}
.meas-preview{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line);display:block}
.meas-preview[hidden]{display:none}
.sketch-fullscreen{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;flex-direction:column;touch-action:pan-x pan-y}
.sketch-fullscreen[hidden]{display:none}
.sketch-fs-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:9px 10px;background:#f2f5f8;border-bottom:1px solid var(--line);flex:0 0 auto;touch-action:manipulation}
.sketch-fs-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sketch-fs-actions{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
.sketch-fs-toolbar select,.sketch-fs-toolbar input[type=color]{width:auto;min-height:38px}
.sketch-fs-toolbar button{padding:9px 14px;flex:0 0 auto}
.sketch-zoom-label{font-size:12px;font-weight:800;color:var(--muted);min-width:38px;text-align:center}
#fsPanFloating{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:900;background:var(--green);color:#fff;box-shadow:0 4px 16px #0004;white-space:nowrap}
#fsPanFloating.active{background:var(--blue)}
#fsSketchDone{font-size:14px;font-weight:900;padding:10px 20px;box-shadow:0 3px 10px #16845c66}
.sketch-viewport{flex:1 1 auto;overflow:auto;background:#dbe1e5;display:flex;align-items:flex-start;justify-content:center;padding:14px;touch-action:pan-x pan-y}
#fsSketchCanvas{background:#fff;box-shadow:0 2px 14px #0002;flex:0 0 auto;touch-action:none}
.sketch-gallery{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.sketch-thumb-wrap{position:relative;width:84px;height:118px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.sketch-thumb{width:100%;height:100%;object-fit:contain}
.sketch-thumb-actions{position:absolute;inset:auto 0 0 0;display:flex;gap:2px;background:#17242dcc}
.sketch-thumb-actions button{flex:1;padding:4px 0;font-size:11px;border-radius:0}
.meas-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.meas-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#eef2f6}
.meas-thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.meas-row-info{flex:1 1 190px;min-width:0}
.meas-row-info b{display:block;font-size:13px;word-break:break-word}
.meas-row-info span{display:block;font-size:11px;color:var(--muted);word-break:break-word}
.meas-row-actions{display:flex;gap:6px;flex:0 0 auto}
.meas-row-actions button{padding:7px 10px;font-size:12px;min-height:34px}
@media(max-width:600px){.meas-columns{grid-template-columns:1fr}}
#authScreen .modalbox{max-width:420px}
.info{background:var(--blue-light);color:var(--blue-dark);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;border-left:3px solid var(--blue)}
.report-head{display:none}
.report-foot{display:none}
.pdf-foot{display:none}
.print-rate-block{display:none}


/* Kehle (v2.52) – Hauptresultate b/c/d dominieren, alles Weitere bleibt
   dezent. Kein Element hier startet versteckt; sollte das je nötig
   werden, braucht die Klasse zusätzlich eine eigene
   .klasse[hidden]{display:none}-Regel (siehe CLAUDE.md 59). */
.kehle-haupt{background:var(--blue-light);border:2px solid var(--blue);border-radius:12px;padding:10px 12px;margin:12px 0 4px}
.kehle-haupt-titel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-dark);margin-bottom:6px}
.kehle-haupt-zeile{display:flex;flex-wrap:nowrap;align-items:baseline;gap:8px;padding:4px 0;border-top:1px solid #ffffff80}
.kehle-haupt-zeile:first-of-type{border-top:0}
.kehle-haupt-buchstabe{font-size:20px;font-weight:800;color:var(--blue-dark);flex:0 0 20px}
.kehle-haupt-wert{font-size:24px;font-weight:800;color:var(--blue-dark);flex:0 0 auto;min-width:96px;text-align:right;white-space:nowrap}
.kehle-haupt-text{flex:1 1 0;min-width:0;font-size:11px;line-height:1.25;color:var(--blue-dark);overflow-wrap:anywhere}
/* Zusatzwerte bewusst schmal: Kurzbezeichnung auf dem Bildschirm, der
   volle Excel-Wortlaut haengt als Tooltip an der Zeile und steht
   ungekuerzt im PDF. */
/* min-width:0 ist hier zwingend: die globale Regel oben (Zeile 33)
   setzt jeder Tabelle min-width:1000px, weil die Stuecklisten-Tabellen
   der App in einem <div class="scroll"> stehen und breit sein duerfen.
   Ohne diese Zeile waere auch die Kehle-Tabelle 1000px breit und wuerde
   rechts aus dem Bildschirm laufen. */
table.kehle-tabelle{width:100%;min-width:0;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.kehle-tabelle th{width:32px;text-align:left;font-weight:800;color:var(--blue-dark);padding:3px 5px 3px 0;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.kehle-tabelle td{padding:3px 4px 3px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.3;overflow-wrap:anywhere}
.kehle-tabelle td.kehle-zahl{width:74px;text-align:right;font-weight:700;white-space:nowrap;padding-right:0}
details.kehle-zwischen summary{cursor:pointer;font-size:11.5px;color:var(--muted);padding:7px 0;min-height:32px}
details.kehle-zwischen[open] summary{margin-bottom:2px}
@media(max-width:600px){
 .kehle-haupt-wert{font-size:21px;min-width:84px}
 .kehle-haupt-buchstabe{font-size:17px;flex:0 0 16px}
 .kehle-haupt-text{font-size:10.5px}
 table.kehle-tabelle{font-size:11px}
 .kehle-tabelle td.kehle-zahl{width:68px}
 .kehle-tabelle th{width:30px}
}

/* ---- Rinne · frei definierbares Profil + Zuschnittliste (v2.57) ----
   Beide Tabellen stehen wie die uebrigen Stuecklisten in einem
   <div class="scroll"> und duerfen breiter als der Bildschirm sein.
   min-width und table-layout werden hier ausdruecklich gesetzt: die
   globale Regel (Zeile 33) gibt jeder Tabelle min-width:1000px und
   table-layout:fixed - bei einer Tabelle mit dynamisch vielen Spalten
   waere beides falsch. */
table.rp-profiltabelle,table.rp-table{width:100%;min-width:0;border-collapse:collapse;
 margin-top:6px;table-layout:auto}
.rp-profiltabelle th,.rp-table th{background:#f2f6f8;text-align:left;font-size:9px;padding:6px 5px;
 color:var(--muted);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.rp-profiltabelle td,.rp-table td{border-top:1px solid var(--line);padding:4px 5px;font-size:12px;
 vertical-align:middle;white-space:nowrap}
.rp-profiltabelle td:first-child,.rp-table td:first-child{color:var(--muted);text-align:left}
.rp-profiltabelle input,.rp-profiltabelle select,
.rp-table input[type=number],.rp-table select{padding:5px 4px;font-size:12px;min-height:34px;
 border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit;min-width:0}
.rp-profiltabelle input[type=text]{width:150px}
.rp-profiltabelle input[type=number]{width:76px;text-align:right}
.rp-profiltabelle select{width:92px}
.rp-table input[type=number]{width:72px;text-align:right}
.rp-table select{width:92px}
.rp-varzelle input[type=number]{width:62px}
/* display:flex auf einem <td> sprengt das Tabellenlayout - die Knoepfe
   liefen in die Nachbarspalte. Deshalb ein innerer Flex-Container. */
.rp-winkel > div{display:flex;gap:3px;align-items:center}
.rp-winkel button,.rp-segbtn button,.rp-table button{min-height:32px;min-width:32px;padding:2px 6px;font-size:12px}
.rp-segbtn{white-space:nowrap}
.rp-segbtn button{margin-right:2px}
.rp-var{color:var(--blue-dark);font-weight:800}
.rp-erg{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.rp-zuschnitt{color:var(--blue-dark)}
@media(max-width:600px){
 .rp-profiltabelle td,.rp-table td{font-size:11.5px}
 .rp-profiltabelle input[type=text]{width:120px}
}
/* Pflichtfeld-Stern (v2.70): rot, fett und etwas groesser als das Label,
   damit er auch auf einem Handy sicher zu sehen ist. Der Stern steht im
   Label, nie im Eingabewert - er kann also nicht mitgetippt werden. */
.pflicht-stern{color:var(--red);font-weight:900;font-size:13px;line-height:1;margin-left:3px;vertical-align:baseline}
/* Offline-Hinweis (v2.70): deutlich, aber nicht alarmierend. Steht ganz
   oben und nimmt auf dem Handy die volle Breite ein. */
.offline-hinweis{background:#fff4e5;border:1px solid #f0c48a;color:#8a5300;
 border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.35}
.offline-hinweis[hidden]{display:none}

/* ---- prototyp/prototyp.css ---- */
/* ===========================================================================
   PROTOTYP · Massaufnahme Rinne Halbrund
   ===========================================================================
   Eigene Datei, damit css/01-basis.css der laufenden App unverändert bleibt.

   ACHTUNG – Lehre aus mehreren Fehlern der App (CLAUDE.md 59, 60.5, 72.5,
   77): css/01-basis.css setzt in den ersten Zeilen sehr breite Grundregeln
   (input/select/textarea auf 100 % Breite und 40 px Höhe, label in
   Grossbuchstaben, table mit min-width:1000px, .bar auf display:flex).
   Jede Regel hier, die eines dieser Elemente betrifft, setzt die
   betroffenen Eigenschaften deshalb ausdrücklich zurück.
   =========================================================================== */

body{background:#eef2f5;margin:0;padding:0 0 90px}

/* ---- Kopf- und Fussleiste ---------------------------------------------- */
.p-topbar{position:sticky;top:0;z-index:40;background:#17202a;color:#fff;
 padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
 justify-content:space-between}
.p-marke{font-size:13px;letter-spacing:.3px}
.p-topknoepfe{display:flex;flex-wrap:wrap;gap:6px}
.p-topknoepfe button{min-height:38px;padding:0 12px;font-size:13px}

.p-fussleiste{position:sticky;bottom:0;z-index:35;background:#fff;
 border-top:1px solid #cfd8de;padding:8px 12px;display:flex;gap:10px;
 margin:14px -12px -90px;padding-bottom:14px}
.p-fussleiste button{flex:1 1 0;min-height:52px;font-size:16px}
.p-fussleiste button[disabled]{opacity:.4}

/* ---- Grundbausteine ----------------------------------------------------- */
#p-app{max-width:820px;margin:0 auto;padding:12px}
.p-hinweisleiste{background:#eaf3fb;border:1px solid #b9d6ee;color:#17202a;
 border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;margin:0 0 12px}
.p-karte{background:#fff;border:1px solid #d5dde3;border-radius:14px;
 padding:14px;margin:0 0 12px}
.p-karte h2{margin:0 0 10px;font-size:16px}
.p-karte h3{margin:16px 0 6px;font-size:13px;color:#68737d;
 text-transform:uppercase;letter-spacing:.5px}

.p-kopf{background:#fff;border:1px solid #d5dde3;border-radius:14px;
 padding:11px 14px;margin:0 0 10px}
.p-kopf-titel{font-size:17px;font-weight:800;word-break:break-word}
.p-kopf-zeile{font-size:12.5px;color:#68737d;margin-top:2px;word-break:break-word}
.p-kopf-fehler{color:#b42318;font-weight:700}

/* ---- Schrittleiste ------------------------------------------------------ */
.p-schritte{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;
 -webkit-overflow-scrolling:touch}
.p-schritt{flex:0 0 auto;display:flex;align-items:center;gap:6px;
 background:#fff;border:1px solid #cfd8de;border-radius:22px;
 min-height:42px;padding:0 13px;font-size:13px;color:#17202a;width:auto}
.p-schritt.aktiv{background:#1769aa;border-color:#1769aa;color:#fff;font-weight:700}
.p-schritt-nr{display:inline-flex;align-items:center;justify-content:center;
 width:20px;height:20px;border-radius:50%;background:#eef2f5;color:#17202a;
 font-size:11px;font-weight:800;flex:0 0 auto}
.p-schritt.aktiv .p-schritt-nr{background:#fff;color:#1769aa}
.p-schritt-text{white-space:nowrap}

/* ---- Felder ------------------------------------------------------------- */
.p-grid{display:flex;flex-wrap:wrap;gap:10px}
.p-feld{flex:1 1 170px;min-width:0}
.p-feld.voll{flex:1 1 100%}
/* label kommt aus der Grundregel in Grossbuchstaben und 9 px - hier nicht. */
.p-feld > label{display:block;font-size:11.5px;font-weight:700;color:#68737d;
 text-transform:none;letter-spacing:0;margin:0 0 4px}
.p-feld input,.p-feld select,.p-feld textarea{width:100%;min-height:46px;font-size:15px}
.p-gross{font-size:18px!important;font-weight:700}
.p-wert{min-height:46px;display:flex;align-items:center;font-size:17px;font-weight:700}
.p-karte textarea{width:100%;min-height:90px;font-size:15px}

.p-schalter{display:flex;align-items:center;gap:8px;min-height:46px;
 font-size:14px;font-weight:600;color:#17202a;text-transform:none;letter-spacing:0}
/* Grundregel macht jede Checkbox 40 px hoch mit Rahmen – hier zurücksetzen. */
.p-schalter input[type=checkbox]{width:24px;height:24px;min-height:0;
 padding:0;border:0;margin:0;flex:0 0 auto}

/* ---- Zeilen ------------------------------------------------------------- */
.p-zeile{border:1px solid #dde4e9;border-radius:12px;padding:11px;margin:10px 0;
 background:#fafcfd}
.p-zeile-kopf{display:flex;align-items:center;justify-content:space-between;
 gap:8px;margin:0 0 8px;font-size:13px}
.p-klein-text{font-size:11.5px;color:#68737d;font-weight:400}
.p-weg{background:#fff;border:1px solid #e3b5b0;color:#b42318;border-radius:9px;
 min-height:36px;width:auto;padding:0 12px;font-size:14px;font-weight:700}
.p-ecke{background:#f2faf8;border-color:#bfe0da}
.p-ecke-aus{background:#f7f9fa;border-color:#e2e8ec}
.p-fehler{background:#fdf3f2;border-color:#e8bcb6}

.p-knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.p-knopfreihe button{flex:1 1 auto;min-height:46px;font-size:14px}
.p-blau{background:#1769aa;color:#fff;border:0;border-radius:11px;font-weight:700}
.p-grau{background:#fff;color:#17202a;border:1px solid #c3ced6;border-radius:11px;font-weight:600}
.p-klein{min-height:34px!important;font-size:12px!important;padding:0 10px;
 width:auto;flex:0 0 auto;margin-left:8px}

/* ---- Meldungen ---------------------------------------------------------- */
.p-hinweis{background:#f4f7f9;border-left:3px solid #9bb0c1;border-radius:0 8px 8px 0;
 padding:8px 10px;margin:10px 0 0;font-size:12.5px;line-height:1.45;color:#3b4750}
.p-warn{background:#fff6e8;border-left:3px solid #e07a1f;border-radius:0 8px 8px 0;
 padding:8px 10px;margin:8px 0 0;font-size:12.5px;color:#8a4a0f;font-weight:600}
.p-leer{color:#8894a0;font-size:13px;padding:12px 2px;text-align:center}
.p-ok{background:#effaf3;border:1px solid #b8e2c8;color:#146c43;border-radius:10px;
 padding:11px;font-size:14px;font-weight:600}
.p-pruefung{display:flex;flex-direction:column;gap:7px}
.p-fehlerzeile{background:#fdf3f2;border:1px solid #e8bcb6;color:#b42318;
 border-radius:10px;padding:10px;font-size:13.5px;line-height:1.4}
.p-warnzeile{background:#fff6e8;border:1px solid #f0c48a;color:#8a5300;
 border-radius:10px;padding:10px;font-size:13.5px;line-height:1.4}

.p-summe{margin:12px 0 0;padding:11px;background:#eef4f9;border-radius:11px;
 font-size:15px;text-align:center}
.p-legende{font-size:11.5px;color:#68737d;text-align:center;margin:4px 0 0}
.p-grundriss{display:flex;justify-content:center}

/* ---- Zusammenfassung ---------------------------------------------------- */
.p-zusammenfassung h2{border-bottom:2px solid #17202a;padding-bottom:6px}
.p-zf-kopf{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.p-zf-kopf > div{flex:1 1 120px;background:#f4f7f9;border-radius:10px;padding:8px 10px}
.p-zf-kopf span{display:block;font-size:10.5px;color:#68737d;text-transform:uppercase;
 letter-spacing:.4px}
.p-zf-kopf b{font-size:15px}
.p-liste{margin:0;padding:0 0 0 20px;font-size:14px;line-height:1.65}
.p-ecke-li{color:#0f766e;font-weight:700}
/* Fixpunkt und Nicht-Fixpunkt im Verlauf klar unterscheiden */
.p-fix-li{color:#1769aa;font-weight:700}
.p-losfix-li{color:#6b4fa8;font-weight:700}
.p-zf-fuss{font-size:13px;color:#3b4750}
.p-bem{margin:6px 0 0;padding:8px 10px;background:#f4f7f9;border-radius:9px;
 white-space:pre-wrap;word-break:break-word}

/* ---- Tabellen ----------------------------------------------------------- */
/* Grundregel setzt jede Tabelle auf min-width:1000px (CLAUDE.md 60.5). */
.p-tabelle{overflow-x:auto}
.p-tabelle table{width:100%;min-width:0;table-layout:auto;font-size:13px}
.p-tabelle th{background:#f4f7f9;text-align:left;font-size:11px;
 text-transform:uppercase;letter-spacing:.4px;color:#68737d;padding:7px 8px;
 border-bottom:1px solid #d5dde3}
.p-tabelle td{padding:8px;border-bottom:1px solid #eef2f5;word-break:break-word}
.p-num{text-align:right;white-space:nowrap}
.p-quelle{color:#68737d;font-size:11.5px}

/* ---- Fotos und Skizze --------------------------------------------------- */
.p-datei{display:flex;align-items:center;justify-content:center;
 background:#1769aa;color:#fff;border-radius:11px;min-height:52px;
 font-size:15px;font-weight:700;cursor:pointer;text-transform:none;
 letter-spacing:0;padding:0 12px}
.p-fotos{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0}
.p-foto{position:relative;flex:0 0 auto;width:130px}
.p-foto.gross{width:100%;max-width:420px}
.p-foto img{width:100%;height:auto;display:block;border-radius:10px;
 border:1px solid #cfd8de}
.p-foto .p-weg{position:absolute;top:6px;right:6px;min-height:32px;padding:0 10px}
.p-fotos .p-leer{flex:1 1 100%}

.p-skizzebox{position:fixed;inset:0;z-index:60;background:#eef2f5;
 padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
/* Ohne diese Zeile bliebe die Fläche trotz hidden sichtbar (CLAUDE.md 59). */
.p-skizzebox[hidden]{display:none}
.p-skizze-kopf{font-size:16px;font-weight:800}
.p-skizze-canvas{width:100%;background:#fff;border:1px solid #cfd8de;
 border-radius:12px;touch-action:none;display:block}

/* ---- Schmale Geräte ----------------------------------------------------- */
.p-kurz{display:none}
@media(max-width:520px){
 /* Auf dem Handy muss die Kopfleiste EINE Zeile bleiben, sonst frisst sie
    dauerhaft über 100 px Höhe. Deshalb kurze Beschriftungen und keine
    Wortmarke – die Knöpfe bleiben aber beschriftet, nicht nur Symbole. */
 .p-marke{display:none}
 .p-topbar{padding:8px 10px}
 .p-topknoepfe{width:100%;gap:5px;flex-wrap:nowrap}
 .p-topknoepfe button{flex:1 1 0;min-width:0;padding:0 6px;font-size:12.5px;
  min-height:42px;white-space:nowrap;overflow:hidden}
 .p-lang{display:none}
 .p-kurz{display:inline}
 .p-feld{flex:1 1 100%}
 .p-foto{width:calc(50% - 5px)}
}

/* ===========================================================================
   PDF / DRUCK
   ===========================================================================
   Der Prototyp läuft als einzelne Datei ohne Server. Ein PDF entsteht über

<script>
/* ---- js/12-rinne-halbrund.js · UNVERÄNDERT aus der laufenden App ---- */
"use strict";
// ---- Rinne Halbrund ---------------------------------------------
let rinneSegments=[];
let rinneDilas=[];
function calcRinneSegment(seg){
 const laenge=Number(seg.laenge)||0;
 const linksF=rinneFittingTypes.find(f=>f.id===Number(seg.linksTyp));
 const rechtsF=rinneFittingTypes.find(f=>f.id===Number(seg.rechtsTyp));
 const linksMass=linksF?Number(linksF.mass_mm)||0:0;
 const rechtsMass=rechtsF?Number(rechtsF.mass_mm)||0:0;
 return laenge+linksMass+rechtsMass;
}
// ---- Rinne Halbrund: automatische Dilatationselement-Platzierung ----
// Werte gemäss Fachliteratur "Spenglerarbeiten", Kap. 4.1.5 "Ausdehnung".
// Werte kommen aus dem Material-Katalog (Einstellungen → Massaufnahmen →
// "Material", Tabelle measurement_materials), gepflegt in 01-basis.js.
function rinneMaterialTabelle(material){
 const m=measurementMaterialOrFallback(material);
 return {label:m.name,mitDehnungselement:Number(m.max_abstand_mm)||5000,abFixpunkten:Number(m.ab_fixpunkt_mm)||2500};
}
function calcDilaPositionsInStretch(L,leftMax,rightMax,middleMax){
 if(L<=0)return[];
 if(L<=Math.min(leftMax,rightMax))return[];
 // Kleinste Anzahl Elemente, mit der die Strecke überhaupt aufgeht
 let n=1;
 while(leftMax+(n-1)*middleMax+rightMax<L-1e-6)n++;
 const anzahl=n+1;
 // Grenze je Stück: aussen gilt an Ecken und Fixpunkten der halbe Abstand
 const grenzen=[];
 for(let i=0;i<anzahl;i++){
  if(i===0)grenzen.push(leftMax);
  else if(i===anzahl-1)grenzen.push(rightMax);
  else grenzen.push(middleMax);
 }
 // Alle Stücke gleich lang. Wer über seiner Grenze liegt, wird darauf
 // festgesetzt; die übrige Länge verteilt sich gleichmässig auf die
 // restlichen Stücke. Das wiederholt sich, bis nichts mehr anschlägt.
 const laengen=new Array(anzahl).fill(0);
 const fest=new Array(anzahl).fill(false);
 for(let runde=0;runde<anzahl;runde++){
  let restLaenge=L, frei=0;
  for(let i=0;i<anzahl;i++){
   if(fest[i])restLaenge-=laengen[i];
   else frei++;
  }
  if(!frei)break;
  const ziel=restLaenge/frei;
  let neuFestgesetzt=false;
  for(let i=0;i<anzahl;i++){
   if(fest[i])continue;
   if(ziel>grenzen[i]+1e-6){laengen[i]=grenzen[i];fest[i]=true;neuFestgesetzt=true;}
   else laengen[i]=ziel;
  }
  if(!neuFestgesetzt)break;
 }
 const positions=[];
 let pos=0;
 for(let i=0;i<anzahl-1;i++){pos+=laengen[i];positions.push(pos);}
 return positions;
}
function isRinneFixpunkt(typId){
 if(!typId)return false;
 const f=rinneFittingTypes.find(x=>x.id===Number(typId));
 return !!(f&&f.is_fixpunkt);
}
function isRinneSchiebestutzen(typId){
 if(!typId)return false;
 const f=rinneFittingTypes.find(x=>x.id===Number(typId));
 return !!(f&&f.is_schiebestutzen);
}
function computeRinneBoundaries(segments){
 // Grenzpunkte entlang des ganzen Verlaufs: 0 = Start von Segment 0, ..., N = Ende des letzten Segments.
 // "fix" = Fixpunkt (strengere Regel), "schiebe" = Schiebestutzen (ersetzt funktional eine Dila,
 // dort gilt die grosszügigere "Mit Dehnungselement"-Regel und es wird KEINE zusätzliche Dila platziert).
 if(!segments.length)return{boundaries:[],gesamtlaenge:0};
 function grenzInfo(typId){
  if(!typId)return null;
  const f=rinneFittingTypes.find(x=>x.id===Number(typId));
  if(!f)return null;
  if(f.is_fixpunkt)return{typ:"fix",name:f.name,symbol:f.symbol};
  if(f.is_schiebestutzen)return{typ:"schiebe",name:f.name,symbol:f.symbol};
  return null;
 }
 function kombiniere(a,b){
  if(a&&a.typ==="fix")return a;
  if(b&&b.typ==="fix")return b;
  if(a&&a.typ==="schiebe")return a;
  if(b&&b.typ==="schiebe")return b;
  return null;
 }
 const grenzen=[];
 let cum=0;
 grenzen.push({pos:0,info:grenzInfo(segments[0].linksTyp)});
 for(let i=0;i<segments.length;i++){
  cum+=Number(segments[i].laenge)||0;
  const istLetzte=i===segments.length-1;
  const info=istLetzte?grenzInfo(segments[i].rechtsTyp):kombiniere(grenzInfo(segments[i].rechtsTyp),grenzInfo(segments[i+1].linksTyp));
  grenzen.push({pos:cum,info});
 }
 const gesamtlaenge=cum;
 const boundaries=[{pos:0,typ:grenzen[0].info?grenzen[0].info.typ:null,name:grenzen[0].info?grenzen[0].info.name:null}];
 for(let i=1;i<grenzen.length-1;i++)if(grenzen[i].info)boundaries.push({pos:grenzen[i].pos,typ:grenzen[i].info.typ,name:grenzen[i].info.name});
 const letzte=grenzen[grenzen.length-1];
 boundaries.push({pos:gesamtlaenge,typ:letzte.info?letzte.info.typ:null,name:letzte.info?letzte.info.name:null});
 return{boundaries,gesamtlaenge};
}
function calcRinneDilas(segments,material){
 const tab=rinneMaterialTabelle(material);
 if(!segments.length)return{dilas:[],tabelle:tab,boundaries:[]};
 const {boundaries,gesamtlaenge}=computeRinneBoundaries(segments);
 const dilas=[];
 for(let i=0;i<boundaries.length-1;i++){
  const left=boundaries[i],right=boundaries[i+1];
  const L=right.pos-left.pos;
  const leftMax=left.typ==="fix"?tab.abFixpunkten:tab.mitDehnungselement;
  const rightMax=right.typ==="fix"?tab.abFixpunkten:tab.mitDehnungselement;
  const relPositions=calcDilaPositionsInStretch(L,leftMax,rightMax,tab.mitDehnungselement);
  relPositions.forEach(rp=>dilas.push({posAbStart:left.pos+rp}));
 }
 return{dilas,tabelle:tab,gesamtlaenge,boundaries};
}
// Berechnet die Stückliste zwischen allen Grenzpunkten und Dilas.
// Wird von der Anzeige, vom Speichern und vom PDF gleichermassen benutzt,
// damit alle drei dieselben Zahlen zeigen.
function berechneRinneStueckliste(segments,dilas,boundaries,dilaMass){
 const segGrenzen=[0];
 let acc=0;
 (segments||[]).forEach(s=>{acc+=Number(s.laenge)||0;segGrenzen.push(acc)});
 const massVon=typId=>{
  const f=rinneFittingTypes.find(x=>x.id===Number(typId));
  return f?Number(f.mass_mm)||0:0;
 };
 // Je Grenzpunkt das Zuschlagsmass für das Stück links bzw. rechts davon
 const massLinksSeite=[],massRechtsSeite=[];
 segGrenzen.forEach((pos,i)=>{
  massLinksSeite[i] =i>0?massVon(segments[i-1].rechtsTyp):0;
  massRechtsSeite[i]=i<segments.length?massVon(segments[i].linksTyp):0;
 });
 const punkte=[];
 segGrenzen.forEach((pos,i)=>{
  const b=(boundaries||[]).find(x=>Math.round(x.pos)===Math.round(pos));
  let label;
  if(b&&b.name)label=b.name;
  else if(i===0)label="Start";
  else if(i===segGrenzen.length-1)label="Ende";
  else label="Segmentgrenze";
  punkte.push({pos,art:"grenze",label,grenzIndex:i});
 });
 (dilas||[]).forEach((d,i)=>punkte.push({pos:Number(d.posAbStart)||0,art:"dila",dilaIndex:i}));
 punkte.sort((a,b)=>a.pos-b.pos);
 const dm=Number(dilaMass)||0;
 const stuecke=[];
 for(let i=1;i<punkte.length;i++){
  const prev=punkte[i-1],cur=punkte[i];
  const abstand=cur.pos-prev.pos;
  const zugabeLinks =prev.art==="grenze"?massRechtsSeite[prev.grenzIndex]:dm;
  const zugabeRechts=cur.art==="grenze"?massLinksSeite[cur.grenzIndex]:dm;
  stuecke.push({
   nr:i,
   von:prev.art==="grenze"?prev.label:`Dila ${punkte.slice(0,i).filter(p=>p.art==="dila").length}`,
   bis:cur.art==="dila"?`Dila ${punkte.slice(0,i+1).filter(p=>p.art==="dila").length}`:cur.label,
   abstand,
   zuschnitt:abstand+zugabeLinks+zugabeRechts,
   pos:cur.pos,
   prevPos:prev.pos,
   dilaIndex:cur.art==="dila"?cur.dilaIndex:null
  });
 }
 return stuecke;
}

function generateRinneGrundriss(segments,dilas,boundaries,enden){
 dilas=dilas||[];
 boundaries=boundaries||[];
 // enden: {anfang:true,ende:true} – setzt bei der Mauerabdeckung ein
 // Bodenzeichen an das jeweilige Ende der Linie.
 enden=enden||{};
 if(!segments.length)return '<div class="small" style="color:var(--muted);text-align:center;padding:20px">Noch keine Segmente für den Grundriss.</div>';
 let x=0,y=0,dir=0;
 const pts=[{x,y}];
 for(const seg of segments){
  const rad=dir*Math.PI/180;
  x+=(Number(seg.laenge)||0)*Math.cos(rad);
  y+=(Number(seg.laenge)||0)*Math.sin(rad);
  pts.push({x,y});
  dir+=Number(seg.winkel)||0;
 }
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY);
 const pad=44,target=280;
 const scale=Math.min(target/w,target/h);
 const toSvg=p=>[pad+(p.x-minX)*scale,pad+(p.y-minY)*scale];
 const svgW=target+2*pad,svgH=target+2*pad;
 let lines="",labels="",arrows="";
 for(let i=0;i<segments.length;i++){
  const [x1,y1]=toSvg(pts[i]),[x2,y2]=toSvg(pts[i+1]);
  lines+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>`;
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len;
  const px=-uy,py=ux,off=15;
  const lx=mx-px*off,ly=my-py*off;
  let angleDeg=Math.atan2(dy,dx)*180/Math.PI;
  if(angleDeg>90||angleDeg<-90)angleDeg+=180;
  labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" fill="#1769aa" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="700" transform="rotate(${angleDeg.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${esc(segments[i].laenge||0)}</text>`;
  // Blickrichtungs-Pfeil auf der Gegenseite der Massbeschriftung: Spitze beruehrt das Segment
  const shaftFar=24,headLen=9,headWidth=5;
  const farX=mx+px*shaftFar,farY=my+py*shaftFar;
  const shaftEndX=mx+px*headLen,shaftEndY=my+py*headLen;
  arrows+=`<line x1="${farX.toFixed(1)}" y1="${farY.toFixed(1)}" x2="${shaftEndX.toFixed(1)}" y2="${shaftEndY.toFixed(1)}" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/>`;
  const p2x=shaftEndX+ux*headWidth,p2y=shaftEndY+uy*headWidth;
  const p3x=shaftEndX-ux*headWidth,p3y=shaftEndY-uy*headWidth;
  arrows+=`<polygon points="${mx.toFixed(1)},${my.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" fill="#b42318"/>`;
 }
 let boeden="";
 const bodenZeichen=(punkt,nachbar,text)=>{
  const [px1,py1]=toSvg(punkt), [px2,py2]=toSvg(nachbar);
  const dx=px2-px1, dy=py2-py1, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;      // zeigt ins Innere der Linie
  const nx=-uy, ny=ux;             // quer dazu
  const halb=11;
  return `<line x1="${(px1+nx*halb).toFixed(1)}" y1="${(py1+ny*halb).toFixed(1)}" x2="${(px1-nx*halb).toFixed(1)}" y2="${(py1-ny*halb).toFixed(1)}" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>`
   +`<text x="${(px1-ux*16).toFixed(1)}" y="${(py1-uy*16).toFixed(1)}" font-size="11" fill="#0f766e" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="700">${esc(text)}</text>`;
 };
 if(enden.anfang&&pts.length>1)boeden+=bodenZeichen(pts[0],pts[1],"Boden");
 if(enden.ende&&pts.length>1)boeden+=bodenZeichen(pts[pts.length-1],pts[pts.length-2],"Boden");
 let symbols="";
 for(let i=0;i<segments.length;i++){
  const sp=toSvg(pts[i]),ep=toSvg(pts[i+1]);
  const linksF=rinneFittingTypes.find(f=>f.id===Number(segments[i].linksTyp));
  const rechtsF=rinneFittingTypes.find(f=>f.id===Number(segments[i].rechtsTyp));
  if(linksF&&linksF.symbol)symbols+=`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="11" fill="#fff" stroke="#68737d" stroke-width="1.5"/><text x="${sp[0].toFixed(1)}" y="${(sp[1]+3).toFixed(1)}" font-size="8" fill="#17202a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">${esc(linksF.symbol)}</text>`;
  if(rechtsF&&rechtsF.symbol)symbols+=`<circle cx="${ep[0].toFixed(1)}" cy="${ep[1].toFixed(1)}" r="11" fill="#fff" stroke="#68737d" stroke-width="1.5"/><text x="${ep[0].toFixed(1)}" y="${(ep[1]+3).toFixed(1)}" font-size="8" fill="#17202a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">${esc(rechtsF.symbol)}</text>`;
 }
 // Hilfsfunktion: SVG-Koordinaten (und lokale Segmentrichtung) für eine Position entlang des ganzen Verlaufs
 function svgPosAt(posAbStart){
  let remaining=posAbStart,segIdx=0;
  while(segIdx<segments.length&&remaining>(Number(segments[segIdx].laenge)||0)){
   remaining-=Number(segments[segIdx].laenge)||0;
   segIdx++;
  }
  if(segIdx>=segments.length)segIdx=segments.length-1;
  const segLen=Number(segments[segIdx].laenge)||1;
  const frac=Math.max(0,Math.min(1,remaining/segLen));
  const [sx1,sy1]=toSvg(pts[segIdx]),[sx2,sy2]=toSvg(pts[segIdx+1]);
  const dx=sx2-sx1,dy=sy2-sy1,len=Math.hypot(dx,dy)||1;
  return {x:sx1+dx*frac,y:sy1+dy*frac,ux:dx/len,uy:dy/len};
 }
 // Positionsnummern: nummeriert ALLE tatsächlichen Stücke, also sowohl die Hauptsegmente als
 // auch die durch Dilas entstehenden Zwischenstücke (jede Segmentgrenze + jede Dila-Position
 // gilt als eigener Schnittpunkt).
 let posNummern="";
 {
  const segGrenzen=[0];
  let cAcc=0;
  segments.forEach(s=>{cAcc+=Number(s.laenge)||0;segGrenzen.push(cAcc);});
  const volleKette=[...new Set([...segGrenzen,...dilas.map(d=>Math.round(Number(d.posAbStart)||0))])].sort((a,b)=>a-b);
  for(let i=0;i<volleKette.length-1;i++){
   const mid=(volleKette[i]+volleKette[i+1])/2;
   const p=svgPosAt(mid);
   const nx=-p.uy,ny=p.ux,off=13;
   const qx=p.x-nx*off,qy=p.y-ny*off;
   posNummern+=`<circle cx="${qx.toFixed(1)}" cy="${qy.toFixed(1)}" r="9" fill="#1769aa"/><text x="${qx.toFixed(1)}" y="${(qy+3.2).toFixed(1)}" font-size="9" fill="#fff" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">${i+1}</text>`;
  }
 }
 // Dilas als kleine orange Rauten entlang des Verlaufs zeichnen
 let dilaMarks="";
 for(const d of dilas){
  const p=svgPosAt(d.posAbStart);
  const r=7;
  dilaMarks+=`<polygon points="${p.x.toFixed(1)},${(p.y-r).toFixed(1)} ${(p.x+r).toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${(p.y+r).toFixed(1)} ${(p.x-r).toFixed(1)},${p.y.toFixed(1)}" fill="#e07a1f" stroke="#8a4a0f" stroke-width="1"/>`;
 }
 // Vermassung: Abstände zwischen Start, Fixpunkten/Schiebestutzen, den Dilas und dem Ende beschriften
 // (orange, parallel zur jeweiligen Linienrichtung).
 let dilaMasse="";
 if(dilas.length||boundaries.length>2){
  const gesamtlaenge=segments.reduce((s,seg)=>s+(Number(seg.laenge)||0),0);
  const kettePositionen=[0,...boundaries.map(b=>b.pos),...dilas.map(d=>d.posAbStart),gesamtlaenge];
  const kette=[...new Set(kettePositionen.map(p=>Math.round(p)))].sort((a,b)=>a-b);
  for(let i=0;i<kette.length-1;i++){
   const gap=kette[i+1]-kette[i];
   if(gap<=0)continue;
   const mid=(kette[i]+kette[i+1])/2;
   const pMid=svgPosAt(mid);
   const nx=-pMid.uy,ny=pMid.ux,off=13;
   const lx=pMid.x+nx*off,ly=pMid.y+ny*off;
   let angleDeg=Math.atan2(pMid.uy,pMid.ux)*180/Math.PI;
   if(angleDeg>90||angleDeg<-90)angleDeg+=180;
   dilaMasse+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" fill="#b45a09" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="700" transform="rotate(${angleDeg.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${esc(gap)}</text>`;
  }
 }
 return `<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;max-width:340px;display:block;margin:6px auto" xmlns="http://www.w3.org/2000/svg">${lines}${arrows}${labels}${posNummern}${symbols}${boeden}${dilaMarks}${dilaMasse}</svg>`;
}
function renderRinneSegmentsTable(){
 const options=rinneFittingTypes.map(f=>`<option value="${f.id}">${esc(f.symbol?f.symbol+" – ":"")}${esc(f.name)}</option>`).join("");
 $("rinne_segmentsBody").innerHTML=rinneSegments.map((s,i)=>`<tr>
<td>${i+1}</td>
<td><input data-rinne-laenge="${i}" type="number" step="1" value="${s.laenge||0}"></td>

<td>${calcRinneSegment(s)}</td>
<td><button type="button" class="red" data-rinne-del="${i}" style="padding:6px 8px">×</button></td>

<script>
/* ---- prototyp/prototyp-rinne.js ---- */
"use strict";
// ===========================================================================
// PROTOTYP · Massaufnahme "Rinne Halbrund"
// ===========================================================================
// Weiterentwicklung des bestehenden Moduls, NICHT eine Parallel-Lösung.
// Die gesamte Fachrechnung kommt unverändert aus js/12-rinne-halbrund.js
// (siehe bruecke.js). Neu ist alles, was der Auftrag zusätzlich verlangt:
// Grunddaten, Verlauf mit Ecken sowie Einhänge- und Schiebestutzen (alle
// drei werden gleich eingefügt und ab dem Abschnitt davor vermasst), Halter,
// Rinnenboden, Dehnung, Fotos, Skizze, Plausibilität, Zusammenfassung,
// Ausmass, Material, PDF, Kopieren, lokales Speichern und ein Ablauf in
// sechs Schritten.
// ===========================================================================

// ---- 1. Grunddaten -------------------------------------------------------
// Genau fünf Rinnengrössen, nichts Freies (Auftrag Änderung 1 und 2).
const RG_GROESSEN=[
 {wert:"200", text:"200 mm"},
 {wert:"250", text:"250 mm"},
 {wert:"330", text:"330 mm"},
 {wert:"400", text:"400 mm"}
];
// Ablaufrohr-Durchmesser
const STUTZEN_DURCHMESSER=["Ø 60","Ø 75","Ø 100","Ø 120"];
// Was an einem Übergang zwischen zwei Abschnitten sitzen kann. Der Stutzen
// wird genau wie der Winkel eingefügt – deshalb eine einzige Auswahl.
const UEBERGAENGE=[
 {wert:"gerade",   text:"gerade weiter (nichts)"},
 {wert:"aussen",   text:"Aussenwinkel"},
 {wert:"innen",    text:"Innenwinkel"},
 {wert:"einhaenge",text:"Einhängestutzen"},
 {wert:"schiebe",  text:"Schiebestutzen"}
];
const FALLROHR_STATUS=["bestehend","neu","unbekannt"];

// Fitting-IDs aus dem bestehenden Katalog (rinne_fitting_types).
// Die Ecke ist dort bereits als Fixpunkt hinterlegt, dadurch wirkt sie
// automatisch auf die Dila-Abstände.
const ECKE_AUSSEN_ID=2, ECKE_INNEN_ID=3;
// Der Einhängestutzen ist ein Fixpunkt. Im bestehenden Katalog trägt der
// "Ablaufstutzen" (id 4) genau diese Eigenschaft (is_fixpunkt = true,
// mass_mm = 0). Der Prototyp verwendet ihn deshalb unverändert weiter,
// statt eine zweite Fixpunktlogik zu bauen.
const EINHAENGE_FITTING_ID=4;
// Der Schiebestutzen (id 7) ist KEIN Fixpunkt, wird aber wie ein
// Dehnungselement behandelt: er nimmt die Ausdehnung an dieser Stelle selbst
// auf. Im bestehenden Katalog trägt er dafür bereits is_schiebestutzen =
// true. computeRinneBoundaries() macht daraus einen Grenzpunkt vom Typ
// "schiebe": die Strecke wird dort geteilt, links und rechts gilt der
// grosszügige Abstand "mit Dehnungselement" (nicht der strenge "ab
// Fixpunkt"), und es wird an dieser Stelle KEINE zusätzliche Dila gesetzt.
// Genau das ist der Unterschied zum Einhängestutzen.
const SCHIEBE_FITTING_ID=7;
// Der Rinnenboden sitzt am äussersten Ende des Verlaufs – und das IST der
// erste bzw. letzte Grenzpunkt. Der bestehende Katalog führt dafür den
// "Boden" (id 5, kein Fixpunkt). Wird er dort als Anschlusstyp gesetzt,
// rechnet berechneRinneStueckliste() sein Mass ohne eine Zeile neuer
// Fachlogik in den Zuschnitt des ersten/letzten Stücks ein.
const BODEN_FITTING_ID=5;

// ---- 1b. Zuschnittmasse (Einstellungen) -----------------------------------
// Jedes Element kann ein Mass tragen, das dem Rinnenzuschnitt zugerechnet
// (+) oder abgezogen (−) wird. Für Winkel, Stutzen, Schiebestutzen und
// Rinnenboden ist das im bestehenden Modul bereits das Feld mass_mm des
// Anschlusstyp-Katalogs; für das Dilatationselement die Firmeneinstellung
// rinneDilaMass. Der Prototyp bearbeitet genau diese beiden Quellen – er
// führt bewusst keine dritte ein, damit der Einbau in die App nichts
// umrechnen muss.
const MASSE_SPEICHER="sd_prototyp_rinne_massen";
// Vorgaben wie in der laufenden App: der Katalog, wie er ausgeliefert wird,
// und -165 mm an der Dila (Vorgabewert aus js/01-basis.js).
const DILA_MASS_VORGABE=-165;
const MASS_VORGABE={};
rinneFittingTypes.forEach(f=>{MASS_VORGABE[f.symbol||("id"+f.id)]=Number(f.mass_mm)||0});
function masseLesen(){
 try{
  const m=JSON.parse(localStorage.getItem(MASSE_SPEICHER)||"null");
  if(!m||typeof m!=="object")return null;
  return m;
 }catch(e){return null}
}
function masseAnwenden(){
 const m=masseLesen()||{};
 const f=(m.fitting&&typeof m.fitting==="object")?m.fitting:{};
 rinneFittingTypes.forEach(t=>{
  const k=t.symbol||("id"+t.id);
  const v=(f[k]===undefined||f[k]===null||f[k]==="")?MASS_VORGABE[k]:Number(f[k]);
  t.mass_mm=Number.isFinite(v)?v:0;
 });
 const d=(m.dila===undefined||m.dila===null||m.dila==="")?DILA_MASS_VORGABE:Number(m.dila);
 rinneDilaMass=Number.isFinite(d)?d:0;
}

const NORMLAENGEN_SPEICHER="sd_prototyp_rinne_normlaengen";
const NORMLAENGEN_VORGABE={
 // Stahl, verzinkt (id 6) – alle Grössen 6 m
 "6|200":[6000], "6|250":[6000], "6|330":[6000], "6|400":[6000],
 // Kupfer (id 3)

 // Nicht angegeben und deshalb bewusst leer: Titanzink 400,
 // Chromstahl verzinnt (id 5), Aluminium (id 1).
};
function normSchluessel(a){return String(a&&a.material)+"|"+String(a&&a.groesse)}

 try{const m=JSON.parse(localStorage.getItem(NORMLAENGEN_SPEICHER)||"null");
  return (m&&typeof m==="object")?m:{};}catch(e){return {}}
}
function normlaengenFuer(a){
 const k=normSchluessel(a);
 const eigen=normlaengenLesen()[k];
 const quelle=Array.isArray(eigen)?eigen:NORMLAENGEN_VORGABE[k];
 if(!Array.isArray(quelle))return null;                 // nichts hinterlegt
 const liste=quelle.map(v=>Math.round(zahl(v))).filter(v=>v>0);

// --- Der Materialbedarf: eindimensionales Verschnittproblem ----------------
// Aus welchen Normlängen lassen sich alle Stücke so schneiden, dass möglichst
// wenig übrig bleibt? Mehrere Stücke dürfen aus derselben Stange kommen.
//
// Vorgehen: zuerst eine brauchbare Lösung gierig bauen – sie liefert die
// Obergrenze. Danach alle Stangen-Kombinationen mit kleinerer oder gleicher
// Gesamtlänge der Reihe nach durchprobieren. Die erste, die aufgeht, ist die
// mit dem kleinsten Materialeinsatz und damit die mit dem wenigsten
// Verschnitt – die Summe der Stücke ist ja fest.
// Reicht das Suchbudget nicht, wird die gierige Lösung zurückgegeben und
// ausdrücklich NICHT als beste ausgewiesen.
const NORM_BUDGET=400000;

// Passen die Stücke (absteigend sortiert) in Stangen mit diesen Längen?
// Exakte Suche mit zwei Abkürzungen: gleich grosse Reste werden nur einmal
// probiert, und wenn die Stücke rechnerisch gar nicht mehr hineinpassen
// können, wird sofort abgebrochen.
function normPasst(stuecke,kapazitaeten,zaehler){
 const rest=kapazitaeten.slice();
 const belegung=kapazitaeten.map(()=>[]);
 function schritt(i,summeRest){
  if(i>=stuecke.length)return true;
  if(zaehler.n++>NORM_BUDGET)return false;
  let frei=0; for(let k=0;k<rest.length;k++)frei+=rest[k];
  if(summeRest>frei)return false;
  const st=stuecke[i];
  const probiert=[];
  for(let k=0;k<rest.length;k++){
   if(rest[k]<st)continue;
   if(probiert.indexOf(rest[k])>=0)continue;     // gleicher Rest: schon probiert
   probiert.push(rest[k]);
   rest[k]-=st; belegung[k].push(st);
   if(schritt(i+1,summeRest-st))return true;
   rest[k]+=st; belegung[k].pop();
  }
  return false;
 }
 let summe=0; stuecke.forEach(x=>{summe+=x});
 if(!schritt(0,summe))return null;
 return kapazitaeten.map((kap,k)=>({laenge:kap,stuecke:belegung[k].slice(),
                                    rest:kap-belegung[k].reduce((x,y)=>x+y,0)}));
}

// Gierige Ausgangslösung: Stange für Stange. Für jede Normlänge wird
// durchgerechnet, wie voll sie würde; genommen wird die mit dem kleinsten
// Rest, bei Gleichstand die kürzere.
function normGierig(stuecke,normen){
 const offen=stuecke.slice().sort((a,b)=>b-a);
 const stangen=[];
 while(offen.length){
  let beste=null;
  normen.forEach(n=>{
   if(offen[0]>n)return;                       // längstes Stück passt nicht
   const genommen=[]; let rest=n;
   offen.forEach(st=>{if(st<=rest){rest-=st;genommen.push(st)}});
   if(!genommen.length)return;
   if(!beste||rest<beste.rest||(rest===beste.rest&&n<beste.laenge))
    beste={laenge:n,rest,stuecke:genommen};
  });
  if(!beste)return null;                        // kein Stück passt irgendwo
  beste.stuecke.forEach(st=>{offen.splice(offen.indexOf(st),1)});
  stangen.push(beste);
 }
 return stangen;
}

function normlaengenPlan(stuecke,normen){
 const teile=(stuecke||[]).map(v=>Math.round(zahl(v))).filter(v=>v>0).sort((a,b)=>b-a);
 if(!Array.isArray(normen)||!normen.length)
  return {ok:false,grund:"keine",stangen:[],zuLang:[],gesamt:0,verschnitt:0,
          summeStuecke:0,optimal:false};
 const maxN=Math.max.apply(null,normen);
 const zuLang=teile.filter(v=>v>maxN);
 const passend=teile.filter(v=>v<=maxN);
 const summeStuecke=passend.reduce((a,b)=>a+b,0);
 if(!passend.length)
  return {ok:zuLang.length===0,grund:zuLang.length?"zuLang":"leer",
          stangen:[],zuLang,gesamt:0,verschnitt:0,summeStuecke:0,optimal:true};

 const gierig=normGierig(passend,normen);
 if(!gierig)return {ok:false,grund:"zuLang",stangen:[],zuLang:passend,
                    gesamt:0,verschnitt:0,summeStuecke,optimal:false};
 const gierigGesamt=gierig.reduce((a,b)=>a+b.laenge,0);

 // Alle Stangen-Kombinationen mit Gesamtlänge zwischen der Summe der Stücke
 // und der gierigen Lösung – nach Gesamtlänge, dann nach Stangenzahl sortiert.
 const nsort=normen.slice().sort((a,b)=>b-a);
 const kombis=[];
 const maxAnzahl=nsort.map(n=>Math.floor(gierigGesamt/n));
 (function baue(i,counts,summe){
  if(summe>gierigGesamt)return;
  if(i===nsort.length){
   if(summe>=summeStuecke)kombis.push({counts:counts.slice(),summe,
    anzahl:counts.reduce((a,b)=>a+b,0)});
   return;
  }
  for(let c=0;c<=maxAnzahl[i];c++){
   counts[i]=c;
   if(summe+c*nsort[i]>gierigGesamt)break;
   baue(i+1,counts,summe+c*nsort[i]);
  }
  counts[i]=0;
 })(0,nsort.map(()=>0),0);
 kombis.sort((a,b)=>a.summe-b.summe||a.anzahl-b.anzahl);

 const zaehler={n:0};
 for(const k of kombis){
  const kap=[];
  k.counts.forEach((c,i)=>{for(let j=0;j<c;j++)kap.push(nsort[i])});
  if(!kap.length)continue;
  const plan=normPasst(passend,kap,zaehler);
  if(plan){
   plan.sort((a,b)=>b.laenge-a.laenge||a.rest-b.rest);
   return {ok:true,grund:"",stangen:plan,zuLang,gesamt:k.summe,
           verschnitt:k.summe-summeStuecke,summeStuecke,optimal:true};
  }
  if(zaehler.n>NORM_BUDGET)break;
 }
 // Budget aufgebraucht: die gierige Lösung, ehrlich als "nicht bewiesen bestes
 // Ergebnis" markiert.
 gierig.sort((a,b)=>b.laenge-a.laenge||a.rest-b.rest);
 return {ok:true,grund:"",stangen:gierig,zuLang,gesamt:gierigGesamt,
         verschnitt:gierigGesamt-summeStuecke,summeStuecke,optimal:false};
}

// Die Stücke, die tatsächlich zugeschnitten werden – dieselbe Quelle wie die
// Zuschnitt-Tabelle, damit Plan und Tabelle nie auseinanderlaufen können.
function zuschnittStuecke(a){
 const d=dilasEffektiv(a);
 return berechneRinneStueckliste(d.segmente,d.dilas,d.boundaries||[],rinneDilaMass)
   .map(s=>Math.round(zahl(s.zuschnitt))).filter(v=>v>0);
}
function normlaengenErgebnis(a){
 return normlaengenPlan(zuschnittStuecke(a),normlaengenFuer(a));
}

// Ältere im Browser gespeicherte Aufnahmen behutsam übernehmen. Es gab
// nacheinander: "ablaeufe", freie Rinnengrössen, "Verbinder", "ohne RG",
// Sonderteile, "endstuecke" und Stutzen als eigene Listen mit einer
// Position ab START. Nichts wird verworfen, was noch eine Entsprechung hat –
// die alten Stutzen werden an die passende Stelle im Verlauf gehängt und
// notfalls wird der Abschnitt dafür geteilt.
const RG_ALT={"RG 200":"200","RG 250":"250","RG 280":"250","RG 333":"330",
              "RG 400":"400","RG 500":"400","andere":"330","ohne":"330"};
const D_ALT={"Ø 80":"Ø 75","Ø 125":"Ø 120","Ø 150":"Ø 120"};
function stutzenInVerlauf(a,liste,art){
 (liste||[]).forEach(st=>{
  const ziel=Math.round(zahl(st.pos_mm));
  const neu={art,durchmesser:D_ALT[st.durchmesser]||st.durchmesser||STUTZEN_DURCHMESSER[2],
             anzahl:Math.max(1,Math.round(zahl(st.anzahl)||1)),
             fallrohr:st.fallrohr||FALLROHR_STATUS[0],bemerkung:st.bemerkung||""};
  let pos=0;
  for(let i=0;i<a.segmente.length;i++){
   const ende=pos+zahl(a.segmente[i].laenge);
   if(ziel>pos&&ziel<ende){          // mitten im Abschnitt: dafür teilen
    const rest=ende-ziel;
    a.segmente[i].laenge=ziel-pos;
    const alterStutzen=a.segmente[i].stutzen, alterWinkel=zahl(a.segmente[i].winkel);
    a.segmente[i].stutzen=neu; a.segmente[i].winkel=0;
    a.segmente.splice(i+1,0,{laenge:rest,linksTyp:"",rechtsTyp:"",
                             winkel:alterWinkel,stutzen:alterStutzen});
    return;
   }
   if(ziel===ende&&i<a.segmente.length-1&&!a.segmente[i].stutzen){
    a.segmente[i].stutzen=neu; return;
   }
   pos=ende;
  }
  // Ganz am Anfang oder am Ende: dort gibt es keinen Übergang. Der Stutzen
  // wird an den nächstgelegenen Übergang gehängt, statt ihn zu verlieren.
  const idx=ziel<=0?0:a.segmente.length-2;
  if(idx>=0&&a.segmente[idx]&&!a.segmente[idx].stutzen)a.segmente[idx].stutzen=neu;
 });
}
function aufnahmeUmstellen(a){
 if(!a||typeof a!=="object")return a;
 if(!Array.isArray(a.segmente)||!a.segmente.length)
  a.segmente=[{laenge:0,linksTyp:"",rechtsTyp:"",winkel:0,stutzen:null}];
 a.segmente.forEach(seg=>{if(seg.stutzen===undefined)seg.stutzen=null});
 // "ablaeufe" (ganz alt) -> Einhängestutzen
 if(Array.isArray(a.ablaeufe)&&a.ablaeufe.length
    &&(!Array.isArray(a.einhaengestutzen)||!a.einhaengestutzen.length))
  a.einhaengestutzen=a.ablaeufe.map(x=>({pos_mm:x.pos_mm,durchmesser:x.durchmesser,
   anzahl:1,fallrohr:x.fallrohr,bemerkung:x.bemerkung||""}));
 stutzenInVerlauf(a,a.einhaengestutzen,"einhaenge");
 stutzenInVerlauf(a,a.schiebestutzen,"schiebe");
 // Nicht auf "rinnenboden fehlt" pruefen: aufnahmeLaden() legt es ueber
 // leereAufnahme() schon an, die Uebernahme liefe sonst ins Leere.
 if(a.endstuecke)a.rinnenboden={links:!!a.endstuecke.links,rechts:!!a.endstuecke.rechts};
 if(!a.rinnenboden)a.rinnenboden={links:true,rechts:true};
 if(a.dilasManuell!==null&&!Array.isArray(a.dilasManuell))a.dilasManuell=null;
 if(Array.isArray(a.dilasManuell))
  a.dilasManuell=a.dilasManuell.map(d=>({posAbStart:zahl(d&&d.posAbStart)}));
 ["ablaeufe","einhaengestutzen","schiebestutzen","verbinder","groesseFrei",
  "sonderteile","endstuecke"].forEach(f=>{delete a[f]});
 if(RG_ALT[a.groesse])a.groesse=RG_ALT[a.groesse];
 if(!RG_GROESSEN.some(g=>g.wert===a.groesse))a.groesse="330";
 return a;
}

// Gesamtlänge aus den Abschnitten – die einzige Quelle für alle Folgewerte.
function gesamtlaengeBerechnet(a){

}

// Ecken entstehen aus dem Verlauf (Auftrag 12): der Winkel steht wie im
// bestehenden Modul am Abschnitt und meint die Richtungsänderung danach.
// Vorzeichen wie im Katalog: negativ = Aussenwinkel, positiv = Innenwinkel.
function eckenAusVerlauf(a){
