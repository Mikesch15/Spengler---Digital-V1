.meas-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.eb-table{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.eb-diagram-box{background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.eb-diagram-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.eb-diagram-scroll svg{display:block}
.eb-table col.eb-col-pos{width:14%}
.eb-table col.eb-col-len{width:32%}
.eb-table col.eb-col-massa{width:26%}
.eb-table col.eb-col-side{width:28%}
.eb-table th{background:#f2f6f8;text-align:left;font-size:9px;padding:6px 5px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.eb-table td{border-top:1px solid var(--line);padding:5px;font-size:12px}
.eb-table td:first-child{text-align:left;color:var(--muted)}
.eb-table td:nth-child(2),.eb-table td:nth-child(3){text-align:left;font-variant-numeric:tabular-nums}
.eb-rest-row td{background:var(--blue-light);font-weight:800}
.start-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
.start-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 10px;border-radius:14px;font-size:14px;font-weight:800;text-align:center;line-height:1.3}
.start-nav-btn small{font-weight:600;font-size:10px;opacity:.85}
.start-nav-icon{font-size:34px;line-height:1}
#topUserBar{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:6px}
.report-topnav{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.report-topnav button{padding:7px 12px;font-size:12px}
@media(max-width:600px){.start-nav{grid-template-columns:1fr}}
.meas-preview{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line);display:block}
.meas-preview[hidden]{display:none}
.sketch-fullscreen{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;flex-direction:column;touch-action:pan-x pan-y}
.sketch-fullscreen[hidden]{display:none}
.sketch-fs-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:9px 10px;background:#f2f5f8;border-bottom:1px solid var(--line);flex:0 0 auto;touch-action:manipulation}
.sketch-fs-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sketch-fs-actions{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
.sketch-fs-toolbar select,.sketch-fs-toolbar input[type=color]{width:auto;min-height:38px}
.sketch-fs-toolbar button{padding:9px 14px;flex:0 0 auto}
.sketch-zoom-label{font-size:12px;font-weight:800;color:var(--muted);min-width:38px;text-align:center}
#fsPanFloating{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:900;background:var(--green);color:#fff;box-shadow:0 4px 16px #0004;white-space:nowrap}
#fsPanFloating.active{background:var(--blue)}
#fsSketchDone{font-size:14px;font-weight:900;padding:10px 20px;box-shadow:0 3px 10px #16845c66}
.sketch-viewport{flex:1 1 auto;overflow:auto;background:#dbe1e5;display:flex;align-items:flex-start;justify-content:center;padding:14px;touch-action:pan-x pan-y}
#fsSketchCanvas{background:#fff;box-shadow:0 2px 14px #0002;flex:0 0 auto;touch-action:none}
.sketch-gallery{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.sketch-thumb-wrap{position:relative;width:84px;height:118px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.sketch-thumb{width:100%;height:100%;object-fit:contain}
.sketch-thumb-actions{position:absolute;inset:auto 0 0 0;display:flex;gap:2px;background:#17242dcc}
.sketch-thumb-actions button{flex:1;padding:4px 0;font-size:11px;border-radius:0}
.meas-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.meas-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#eef2f6}
.meas-thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.meas-row-info{flex:1 1 190px;min-width:0}
.meas-row-info b{display:block;font-size:13px;word-break:break-word}
.meas-row-info span{display:block;font-size:11px;color:var(--muted);word-break:break-word}
.meas-row-actions{display:flex;gap:6px;flex:0 0 auto}
.meas-row-actions button{padding:7px 10px;font-size:12px;min-height:34px}
@media(max-width:600px){.meas-columns{grid-template-columns:1fr}}
#authScreen .modalbox{max-width:420px}
.info{background:var(--blue-light);color:var(--blue-dark);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;border-left:3px solid var(--blue)}
.report-head{display:none}
.report-foot{display:none}
.pdf-foot{display:none}
.print-rate-block{display:none}


/* Kehle (v2.52) – Hauptresultate b/c/d dominieren, alles Weitere bleibt
   dezent. Kein Element hier startet versteckt; sollte das je nötig
   werden, braucht die Klasse zusätzlich eine eigene
   .klasse[hidden]{display:none}-Regel (siehe CLAUDE.md 59). */
.kehle-haupt{background:var(--blue-light);border:2px solid var(--blue);border-radius:12px;padding:10px 12px;margin:12px 0 4px}
.kehle-haupt-titel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-dark);margin-bottom:6px}
.kehle-haupt-zeile{display:flex;flex-wrap:nowrap;align-items:baseline;gap:8px;padding:4px 0;border-top:1px solid #ffffff80}
.kehle-haupt-zeile:first-of-type{border-top:0}
.kehle-haupt-buchstabe{font-size:20px;font-weight:800;color:var(--blue-dark);flex:0 0 20px}
.kehle-haupt-wert{font-size:24px;font-weight:800;color:var(--blue-dark);flex:0 0 auto;min-width:96px;text-align:right;white-space:nowrap}
.kehle-haupt-text{flex:1 1 0;min-width:0;font-size:11px;line-height:1.25;color:var(--blue-dark);overflow-wrap:anywhere}
/* Zusatzwerte bewusst schmal: Kurzbezeichnung auf dem Bildschirm, der
   volle Excel-Wortlaut haengt als Tooltip an der Zeile und steht
   ungekuerzt im PDF. */
/* min-width:0 ist hier zwingend: die globale Regel oben (Zeile 33)
   setzt jeder Tabelle min-width:1000px, weil die Stuecklisten-Tabellen
   der App in einem <div class="scroll"> stehen und breit sein duerfen.
   Ohne diese Zeile waere auch die Kehle-Tabelle 1000px breit und wuerde
   rechts aus dem Bildschirm laufen. */
table.kehle-tabelle{width:100%;min-width:0;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.kehle-tabelle th{width:32px;text-align:left;font-weight:800;color:var(--blue-dark);padding:3px 5px 3px 0;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.kehle-tabelle td{padding:3px 4px 3px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.3;overflow-wrap:anywhere}
.kehle-tabelle td.kehle-zahl{width:74px;text-align:right;font-weight:700;white-space:nowrap;padding-right:0}
details.kehle-zwischen summary{cursor:pointer;font-size:11.5px;color:var(--muted);padding:7px 0;min-height:32px}
details.kehle-zwischen[open] summary{margin-bottom:2px}
@media(max-width:600px){
 .kehle-haupt-wert{font-size:21px;min-width:84px}
 .kehle-haupt-buchstabe{font-size:17px;flex:0 0 16px}
 .kehle-haupt-text{font-size:10.5px}
 table.kehle-tabelle{font-size:11px}
 .kehle-tabelle td.kehle-zahl{width:68px}
 .kehle-tabelle th{width:30px}
}

/* ---- Rinne · frei definierbares Profil + Zuschnittliste (v2.57) ----
   Beide Tabellen stehen wie die uebrigen Stuecklisten in einem
   <div class="scroll"> und duerfen breiter als der Bildschirm sein.
   min-width und table-layout werden hier ausdruecklich gesetzt: die
   globale Regel (Zeile 33) gibt jeder Tabelle min-width:1000px und
   table-layout:fixed - bei einer Tabelle mit dynamisch vielen Spalten
   waere beides falsch. */
table.rp-profiltabelle,table.rp-table{width:100%;min-width:0;border-collapse:collapse;
 margin-top:6px;table-layout:auto}
.rp-profiltabelle th,.rp-table th{background:#f2f6f8;text-align:left;font-size:9px;padding:6px 5px;
 color:var(--muted);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.rp-profiltabelle td,.rp-table td{border-top:1px solid var(--line);padding:4px 5px;font-size:12px;
 vertical-align:middle;white-space:nowrap}
.rp-profiltabelle td:first-child,.rp-table td:first-child{color:var(--muted);text-align:left}
.rp-profiltabelle input,.rp-profiltabelle select,
.rp-table input[type=number],.rp-table select{padding:5px 4px;font-size:12px;min-height:34px;
 border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit;min-width:0}
.rp-profiltabelle input[type=text]{width:150px}
.rp-profiltabelle input[type=number]{width:76px;text-align:right}
.rp-profiltabelle select{width:92px}
.rp-table input[type=number]{width:72px;text-align:right}
.rp-table select{width:92px}
.rp-varzelle input[type=number]{width:62px}
/* display:flex auf einem <td> sprengt das Tabellenlayout - die Knoepfe
   liefen in die Nachbarspalte. Deshalb ein innerer Flex-Container. */
.rp-winkel > div{display:flex;gap:3px;align-items:center}
.rp-winkel button,.rp-segbtn button,.rp-table button{min-height:32px;min-width:32px;padding:2px 6px;font-size:12px}
.rp-segbtn{white-space:nowrap}
.rp-segbtn button{margin-right:2px}
.rp-var{color:var(--blue-dark);font-weight:800}
.rp-erg{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.rp-zuschnitt{color:var(--blue-dark)}
@media(max-width:600px){
 .rp-profiltabelle td,.rp-table td{font-size:11.5px}
 .rp-profiltabelle input[type=text]{width:120px}
}
/* Pflichtfeld-Stern (v2.70): rot, fett und etwas groesser als das Label,
   damit er auch auf einem Handy sicher zu sehen ist. Der Stern steht im
   Label, nie im Eingabewert - er kann also nicht mitgetippt werden. */
.pflicht-stern{color:var(--red);font-weight:900;font-size:13px;line-height:1;margin-left:3px;vertical-align:baseline}
/* Offline-Hinweis (v2.70): deutlich, aber nicht alarmierend. Steht ganz
   oben und nimmt auf dem Handy die volle Breite ein. */
.offline-hinweis{background:#fff4e5;border:1px solid #f0c48a;color:#8a5300;
 border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.35}
.offline-hinweis[hidden]{display:none}

/* ---- Rinne Halbrund · Aufnahme (js/28) ---------------------------------- */
/* Die globalen Grundregeln (input{min-height:40px}, label{uppercase},
   table{min-width:1000px}) gelten auch hier - Tabellen stehen deshalb wie
   ueberall in .scroll, und es wird nichts davon still ueberschrieben. */
.ra-block{margin-top:4px}
.ra-zeile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.ra-zeile-kopf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ra-zeile-kopf b{font-size:13px}
.ra-klein{font-size:11.5px;color:var(--muted);font-weight:400}
.ra-weg{min-height:34px;padding:0 10px;flex:0 0 auto}
.ra-ueb{background:#f4f9f8;border-color:#cfe4e0}
.ra-ueb-aus{background:#fafbfc;border-color:var(--line)}
.ra-ueb-stutzen{background:#f5f2fb;border-color:#ddd3ee}
.ra-wert{min-height:40px;display:flex;align-items:center;font-weight:700;font-size:14px;
 padding:8px;border:1px dashed var(--line);border-radius:9px;background:#fafbfc;word-break:break-word}
.ra-schalter{display:flex;align-items:center;gap:8px;min-height:40px;font-size:13px;
 font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
.ra-schalter input{width:auto;min-height:0;padding:0;border:0;transform:scale(1.25);flex:0 0 auto}
.ra-pruefung{display:flex;flex-direction:column;gap:6px}
.ra-fehler{background:#fdf1f0;border-left:3px solid #b42318;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#8a2018}
.ra-warnung{background:#fdf6ec;border-left:3px solid #d9822b;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#8a5312}
.ra-ok{background:#eff9f2;border-left:3px solid #2e7d4f;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#1f5c39}
.ra-liste{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.55}
.ra-warn{background:#fdf6ec;color:#8a5312;border-left-color:#d9822b}
/* Legende unter dem Verlaufsband - ohne sie waeren die berechneten
   Dehnungselemente nur unbeschriftete Rauten. */
.ra-legende{font-size:11px;color:var(--muted);line-height:1.5;margin:2px 0 8px;text-align:center}
/* Rinnenboden und Dehnung stehen in einem eigenen, abgesetzten Block, damit
   die berechneten Dehnungselemente sichtbar sind und nicht in einer
   Feldreihe untergehen. */
.ra-dehnung{background:#fdf8f2;border:1px solid #f0dcc3;border-radius:12px;padding:10px;margin:10px 0}
.ra-dehnung-zahl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;
 color:var(--ink);margin-bottom:4px}
.ra-dehnung-zahl span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.ra-dehnung-zahl b{font-size:17px;color:#b4610a}
.ra-dehnung-liste{margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6}
/* Kurz sichtbar machen, wohin "Fertig" gefuehrt hat. */
.ra-ziel{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.ra-dila-zeile{background:var(--blue-light)}
.ra-dila-feld{max-width:130px;text-align:right;font-variant-numeric:tabular-nums}
.ra-rest{color:#b4610a;font-weight:700}
@media (max-width:520px){.ra-dila-feld{max-width:none}}
/* Die globale Grundregel table{min-width:1000px} ist fuer die breiten
   Stuecklisten gedacht. Die Tabellen der Rinnen-Aufnahme haben wenige,
   kurze Spalten und sollen auf dem Handy ganz sichtbar sein - min-width
   muss dafuer AUSDRUECKLICH zurueckgesetzt werden, width:100% allein
   reicht nicht (siehe CLAUDE.md 60.5). */
.eb-table.ra-tab{min-width:0;table-layout:auto}
.eb-table.ra-tab td,.eb-table.ra-tab th{word-break:break-word}
/* Register-Fuehrung durch die Rinnen-Massaufnahme (wie in der Testapp).
   .ra-register-knopf setzt min-height/padding/width ausdruecklich zurueck -
   die globale button-Regel wuerde sie sonst ueberschreiben. */
.ra-register{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;
 -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.ra-register-knopf{flex:0 0 auto;width:auto;display:inline-flex;align-items:center;gap:6px;
 background:#fff;border:1px solid var(--line);border-radius:22px;
 min-height:42px;padding:0 13px;font-size:13px;font-weight:600;color:var(--ink);
 white-space:nowrap;cursor:pointer;position:relative}
.ra-register-knopf.aktiv{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.ra-register-nr{display:inline-flex;align-items:center;justify-content:center;
 width:20px;height:20px;border-radius:50%;background:#eef2f5;color:var(--ink);
 font-size:11px;font-weight:800;flex:0 0 auto}
.ra-register-knopf.aktiv .ra-register-nr{background:#fff;color:var(--blue)}
.ra-register-punkt{width:8px;height:8px;border-radius:50%;background:#d9822b;flex:0 0 auto}
.ra-register-punkt.fehler{background:#b42318}
.ra-register-knopf.aktiv .ra-register-punkt{box-shadow:0 0 0 2px #fff}
.ra-blaettern{justify-content:space-between;margin-top:14px}
.ra-blaettern button{flex:1 1 46%;min-height:46px;font-weight:700}

/* ---- prototyp-freies-profil/prototyp.css ---- */
/* Prototyp Freies Profil – nur die Ergänzungen zur App-Grundschrift.
   Auf ein Android-Tablet ausgelegt: grosse Trefferflächen, keine festen
   Breiten, alles umbruchfähig. */

.p-app{max-width:900px;margin:0 auto;padding:10px 12px 40px}

.p-kopf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
 justify-content:space-between;margin:6px 0 12px}
.p-kopf h1{margin:0;font-size:21px;letter-spacing:.2px}
.p-kopf-klein{font-size:11.5px;color:var(--muted)}
.p-kopf-knoepfe{display:flex;flex-wrap:wrap;gap:8px}
.p-kopf-knoepfe button{min-height:44px;padding:0 14px}

.p-karte{background:#fff;border:1px solid var(--line);border-radius:14px;
 padding:12px 12px 14px;margin:0 0 12px}
.p-karte h2{margin:2px 0 10px;font-size:12px;text-transform:uppercase;
 letter-spacing:.6px;color:var(--muted)}
.p-karte h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;
 letter-spacing:.5px;color:var(--muted)}
.p-klapp[hidden]{display:none}

/* Register – scrollt auf schmalen Geräten seitwärts */
.p-register{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.p-register::-webkit-scrollbar{display:none}
.p-register-knopf{flex:0 0 auto;display:flex;align-items:center;gap:7px;
 min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:11px;
 background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.p-register-knopf.aktiv{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.p-register-nr{display:inline-flex;align-items:center;justify-content:center;
 width:20px;height:20px;border-radius:50%;background:#eef2f5;color:var(--muted);
 font-size:11px;font-weight:700}
.p-register-knopf.aktiv .p-register-nr{background:var(--blue);color:#fff}
.p-punkt{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-punkt-rot{background:#b42318}
.p-punkt-orange{background:#d9822b}

.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.p-feld label{display:block;font-size:10.5px;text-transform:uppercase;
 letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:3px}
.p-voll{grid-column:1/-1}
.p-gross{font-size:17px;font-weight:700;min-height:48px}

.p-knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.p-knopfreihe button{min-height:44px;padding:0 14px;flex:1 1 auto}
.p-blau{background:var(--blue);color:#fff;border:0}
.p-gruen{background:var(--green);color:#fff;border:0}
.p-grau{background:#eef2f5;color:var(--ink);border:1px solid var(--line)}
.p-weg{background:#fdf1f0;color:#8a2018;border:1px solid #f2ccc8;
 min-height:36px;padding:0 10px}

.p-blaettern{display:flex;gap:10px;margin:14px 0 0}
.p-blaettern button{min-height:48px;flex:1 1 0;font-size:14px;font-weight:700}

.p-hinweis{background:var(--blue-light);border-radius:10px;padding:9px 11px;
 font-size:12px;line-height:1.55;margin:10px 0 0}
.p-legende{font-size:11.5px;color:var(--muted);line-height:1.55;
 text-align:center;margin:4px 0 8px}
.p-klein-text{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.p-leer{color:var(--muted);font-size:12.5px;text-align:center;padding:14px}

/* Schnittzeichnung – zentral und gross genug für ein Tablet */
.p-schnitt{background:#fafbfc;border:1px solid var(--line);border-radius:12px;
 padding:12px;margin:12px 0 4px;display:flex;justify-content:center}
.p-schnitt svg{max-width:460px!important;width:100%}
.p-grundriss{background:#fafbfc;border:1px solid var(--line);border-radius:12px;
 padding:10px;display:flex;justify-content:center}

/* Kennzahlen */
.p-zf-kopf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
 gap:8px;margin:12px 0 0}
.p-zf-kopf>div{background:#fafbfc;border:1px solid var(--line);border-radius:10px;
 padding:8px 10px;min-width:0}
.p-zf-kopf span{display:block;font-size:10px;text-transform:uppercase;
 letter-spacing:.4px;color:var(--muted);font-weight:700}
.p-zf-kopf b{font-size:16px;word-break:break-word}
.p-zf-fuss{font-size:12px;color:var(--muted);margin-top:10px}
.p-warnwert{color:#b42318}

/* Tabellen: die globale Grundregel table{min-width:1000px} in
   css/01-basis.css ist für die breiten Stücklisten der App gedacht.
   Hier muss min-width AUSDRÜCKLICH zurückgesetzt werden – width:100%
   allein reicht nicht. */
.p-tabelle-scroll{overflow-x:auto;margin-top:10px}
table.p-tabelle{width:100%;min-width:0;table-layout:auto;border-collapse:collapse}
.p-tabelle th,.p-tabelle td{border-bottom:1px solid var(--line);
 padding:7px 6px;font-size:12.5px;text-align:left;word-break:break-word}

"use strict";

// ---- abgerundeterPfad()  ·  aus js/14-freies-profil.js  ·  unverändert ----
function abgerundeterPfad(punkte,radius){
 if(punkte.length<2)return "";
 const P=(pt)=>`${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`;
 if(punkte.length===2)return `M ${P(punkte[0])} L ${P(punkte[1])}`;
 let d=`M ${P(punkte[0])}`;
 for(let i=1;i<punkte.length-1;i++){
  const [vx,vy]=punkte[i];
  const [ax,ay]=punkte[i-1];
  const [bx,by]=punkte[i+1];
  // Richtungen von der Ecke weg, jeweils auf Länge 1
  const ux=ax-vx, uy=ay-vy, wx=bx-vx, wy=by-vy;
  const lenU=Math.hypot(ux,uy)||1, lenW=Math.hypot(wx,wy)||1;
  const unx=ux/lenU, uny=uy/lenU, wnx=wx/lenW, wny=wy/lenW;
  let cos=unx*wnx+uny*wny;
  cos=Math.max(-1,Math.min(1,cos));
  const phi=Math.acos(cos); // Innenwinkel an der Biegung
  // Fast gerade oder vollständige Umkehr: nichts zu runden
  if(phi>Math.PI-0.03||phi<0.03){d+=` L ${P(punkte[i])}`;continue}
  // Tangentenabstand, begrenzt durch die kürzere der beiden Schenkellängen
  const t=Math.min(radius,lenU*0.45,lenW*0.45);
  const r=t*Math.tan(phi/2); // Radius des Kreisbogens
  const p1=[vx+unx*t, vy+uny*t];
  const p2=[vx+wnx*t, vy+wny*t];
  // Drehrichtung aus dem Kreuzprodukt (Bildkoordinaten: y zeigt nach unten)
  const kreuz=(vx-ax)*(by-vy)-(vy-ay)*(bx-vx);
  const sweep=kreuz>0?1:0;
  d+=` L ${P(p1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 0 ${sweep} ${P(p2)}`;
 }
 d+=` L ${P(punkte[punkte.length-1])}`;
 return d;
}

// ---- ansichtsPfeilSvg()  ·  aus js/14-freies-profil.js  ·  unverändert ----
function ansichtsPfeilSvg(seite,breite,hoehe,ox,oy){
 ox=ox||0; oy=oy||0;
 if(!seite||seite==="keiner")return "";
 const laenge=26, kopf=9, halb=5, luft=4;
 let sx,sy,ex,ey,k1x,k1y,k2x,k2y;
 // Der Pfeil liegt vollständig innerhalb des Bildes: Schaft aussen am Rand,
 // Spitze nach innen zur Zeichnung hin.
 if(seite==="links"){      sx=luft;          sy=hoehe/2; ex=sx+laenge; ey=sy; }
 else if(seite==="rechts"){sx=breite-luft;   sy=hoehe/2; ex=sx-laenge; ey=sy; }
 else if(seite==="oben"){  sx=breite/2;      sy=luft;    ex=sx; ey=sy+laenge; }
 else{                     sx=breite/2;      sy=hoehe-luft; ex=sx; ey=sy-laenge; }
 const dx=ex-sx, dy=ey-sy, len=Math.hypot(dx,dy)||1;
 const ux=dx/len, uy=dy/len, px=-uy, py=ux;
 const bx=ex-ux*kopf, by=ey-uy*kopf;
 k1x=bx+px*halb; k1y=by+py*halb; k2x=bx-px*halb; k2y=by-py*halb;
 return `<line x1="${(sx+ox).toFixed(1)}" y1="${(sy+oy).toFixed(1)}" x2="${(bx+ox).toFixed(1)}" y2="${(by+oy).toFixed(1)}" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/>`
  +`<polygon points="${(ex+ox).toFixed(1)},${(ey+oy).toFixed(1)} ${(k1x+ox).toFixed(1)},${(k1y+oy).toFixed(1)} ${(k2x+ox).toFixed(1)},${(k2y+oy).toFixed(1)}" fill="#b42318"/>`;
}

// ---- generateProfilDiagramSvg()  ·  aus js/14-freies-profil.js  (4 Korrekturen, siehe uebernehmen.js) ----
function generateProfilDiagramSvg(schenkel){
 if(!schenkel.length)return '<div class="small" style="color:var(--muted);text-align:center;padding:20px">Noch keine Schenkel für die Zeichnung.</div>';
 let x=0,y=0,dir=0;
 const pts=[{x,y}];
 const dirs=[0];
 for(let i=0;i<schenkel.length;i++){
  const s=schenkel[i];
  // Auch der erste Schenkel wird gedreht: 0° = waagerecht.
  dir+=Number(s.winkel)||0;
  dirs.push(dir);
  const rad=dir*Math.PI/180;
  x+=(Number(s.laenge)||0)*Math.cos(rad);
  y+=(Number(s.laenge)||0)*Math.sin(rad);
  pts.push({x,y});
 }
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY);
 const pad=30,target=240;
 const scale=Math.min(target/w,target/h);
 const toSvg=p=>[pad+(p.x-minX)*scale,pad+(p.y-minY)*scale];
 const svgW=target+2*pad,svgH=target+2*pad;
 const svgPtsRaw=pts.map(toSvg);
 // Ist Schenkel i ein Umschlag (180°)? Der wird als eigene, kurze, parallel versetzte Linie
 // mit kleinem Abstand gezeichnet, statt sich exakt mit dem vorherigen Schenkel zu decken.
 const GAP=9;
 // Zeichnerischer Biegeradius in Bildpunkten
 const BIEGERADIUS=5;
 function istUmschlag(i){
  if(i===0)return false;
  const winkelNorm=((Number(schenkel[i].winkel)||0)%360+360)%360;
  return Math.abs(winkelNorm-180)<0.5;
 }

 // KORRIGIERT IM PROTOTYP: laufender Versatz statt Versatz nur am Umschlag.
 const versatz=[[0,0]];
 const drawEnds=schenkel.map((s,i)=>{
  const [ox,oy]=versatz[i];
  const [x1,y1]=svgPtsRaw[i],[x2,y2]=svgPtsRaw[i+1];
  if(!istUmschlag(i)){versatz.push([ox,oy]);return[[x1+ox,y1+oy],[x2+ox,y2+oy]]}
  const radDir=dirs[i+1]*Math.PI/180;
  const nx=-Math.sin(radDir),ny=Math.cos(radDir);
  versatz.push([ox+nx*GAP,oy+ny*GAP]);
  return[[x1+ox+nx*GAP,y1+oy+ny*GAP],[x2+ox+nx*GAP,y2+oy+ny*GAP]];
 });
 // Zusammenhängende Abschnitte (ohne Umschlag-Schenkel) als je eine Polyline mit runden Ecken;
 // Umschlag-Schenkel werden als eigene kurze Linie gezeichnet (dadurch entsteht der Abstand).
 let lines="";
 let aktuellerPfad=[drawEnds.length?drawEnds[0][0]:svgPtsRaw[0]];
 for(let i=0;i<schenkel.length;i++){
  if(istUmschlag(i)){
   if(aktuellerPfad.length>1){
    lines+=`<path d="${abgerundeterPfad(aktuellerPfad,BIEGERADIUS)}" fill="none" stroke="#17202a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
   }
   const [[ux1,uy1],[ux2,uy2]]=drawEnds[i];
   // Die Kehre des Umschlags als Halbkreis zeichnen: vom Ende des vorherigen
   // Schenkels um die Spitze herum auf die versetzte Rücklaufl inie.
   const [sx,sy]=[svgPtsRaw[i][0]+versatz[i][0],svgPtsRaw[i][1]+versatz[i][1]];
   const radVor=dirs[i]*Math.PI/180;
   const dvx=Math.cos(radVor),dvy=Math.sin(radVor);   // Laufrichtung davor
   const nx2=(ux1-sx)/GAP,ny2=(uy1-sy)/GAP;          // Versatzrichtung, Länge 1
   const kreuzU=nx2*dvy-ny2*dvx;                      // Kehre nach aussen wölben
   const sweepU=kreuzU>0?0:1;
   lines+=`<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${(GAP/2).toFixed(1)} ${(GAP/2).toFixed(1)} 0 0 ${sweepU} ${ux1.toFixed(1)} ${uy1.toFixed(1)} L ${ux2.toFixed(1)} ${uy2.toFixed(1)}" fill="none" stroke="#17202a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
   aktuellerPfad=[drawEnds[i][1]];
  }else{
   aktuellerPfad.push(drawEnds[i][1]);
  }
 }
 if(aktuellerPfad.length>1){
  lines+=`<path d="${abgerundeterPfad(aktuellerPfad,BIEGERADIUS)}" fill="none" stroke="#17202a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
 }
 let labels="",nums="";
 for(let i=0;i<schenkel.length;i++){
  const [[x1,y1],[x2,y2]]=drawEnds[i];
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const lx=mx-nx*14,ly=my-ny*14;
  let angleDeg=Math.atan2(dy,dx)*180/Math.PI;
  if(angleDeg>90||angleDeg<-90)angleDeg+=180;
  labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11" fill="#1769aa" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="700" transform="rotate(${angleDeg.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${esc(schenkel[i].laenge||0)}</text>`;
  const numx=mx+nx*14,numy=my+ny*14;
  nums+=`<circle cx="${numx.toFixed(1)}" cy="${numy.toFixed(1)}" r="9" fill="#e07a1f"/><text x="${numx.toFixed(1)}" y="${(numy+3.2).toFixed(1)}" font-size="9" fill="#fff" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">${i+1}</text>`;
 }
 const pfeil=ansichtsPfeilSvg($("fp_ansicht")?$("fp_ansicht").value:"keiner",svgW,svgH);
 return `<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;max-width:280px;display:block;margin:6px auto" xmlns="http://www.w3.org/2000/svg">${lines}${labels}${nums}${pfeil}</svg>`;
}

// ---- fpPruefeErkannteSchenkel()  ·  aus js/14-freies-profil.js  ·  unverändert ----
function fpPruefeErkannteSchenkel(roh){
 if(!Array.isArray(roh))return [];
 const gut=[];
 for(const e of roh){
  if(gut.length>=FP_MAX_SCHENKEL)break;
  if(!e||typeof e!=="object")continue;
  const l=Number(e.laenge);
  let w=Number(e.winkel);
  if(!Number.isFinite(l)||l<=0)continue;      // Laenge 0 ist keine Geometrie
  if(!Number.isFinite(w))w=0;
  w=Math.max(-180,Math.min(180,w));
  gut.push({laenge:Math.round(l),winkel:gut.length===0?0:Math.round(w)});
 }
 return gut.length>=2?gut:[];                 // ein einzelner Schenkel ist kein Profil
}

  .sort((a,b)=>ebaZahl(b.laenge)-ebaZahl(a.laenge));
 if(!stuecke.length)return {streifen:[],optimal:true};
 if(ebaZahl(stuecke[0].laenge)>L)
  return {streifen:null,optimal:true,zuLang:stuecke.filter(x=>ebaZahl(x.laenge)>L)};

  const s=gierig.find(g=>g.rest>=ebaZahl(x.laenge)-1e-9);
  if(s){s.stuecke.push(x);s.rest-=ebaZahl(x.laenge)}
  else gierig.push({stuecke:[x],rest:L-ebaZahl(x.laenge)});

  const len=ebaZahl(stuecke[i].laenge), gesehen=[];

// Ein Streifen kann mehrere Stuecke HINTEREINANDER aufnehmen.
//
//   Streifen je Tafel = ganzzahlig(Rollenbreite / Streifenbreite)

const FP_ROLLEN_SPEICHER="pfp_rollenbreiten";
function rollenbreitenGewaehlt(){

  a.segmente.forEach((seg,i)=>{

  const m=String(data.error||"");
  const brauchbar=m.indexOf(" ")>=0&&m.length>=15;
  if(!brauchbar)console.error("extract-profile-shape:",res.status,data.error);
  throw new Error(brauchbar?m
   :"Die Erkennung ist fehlgeschlagen. Bitte erneut versuchen oder das Profil von Hand erfassen.");
 }
 return {schenkel:data.schenkel||[],verworfen:Number(data.verworfen)||0};
}

function vorschauSchliessen(){erkanntesProfil=null;erkanntVerworfen=0}

async function erkennungStarten(){
 const bild=aufnahme.skizze||(aufnahme.fotos||[])[aufnahme.fotos.length-1];
 if(!bild){
  erkennungStatus="⚠️ Zuerst eine Skizze zeichnen oder ein Foto aufnehmen (Register 7).";
  zeichne(); return;
 }
 vorschauSchliessen();
 erkennungLaeuft=true;
 erkennungStatus="🔄 Form wird erkannt …";
 zeichne();
 try{
  const antwort=await erkenneProfil(bild);
  // Prüfung mit der Funktion der App - kein zweiter Filter.
  const erkannt=fpPruefeErkannteSchenkel(antwort.schenkel);
  if(!erkannt.length){
   erkennungStatus="⚠️ Keine eindeutige Form erkannt – bitte manuell erfassen oder deutlicher skizzieren.";
  }else{
   erkanntesProfil=erkannt;
   erkanntVerworfen=antwort.verworfen||0;
   erkennungStatus="";
  }
 }catch(err){
  // Nie ein Profil übernehmen, wenn etwas schiefging.
  vorschauSchliessen();
  erkennungStatus="⚠️ "+((err&&err.message)||"Die Erkennung ist fehlgeschlagen.");
 }
 erkennungLaeuft=false;
 zeichne();
}

function erkanntesUebernehmen(){
 if(!erkanntesProfil||!erkanntesProfil.length)return false;
 if(aufnahme.schenkel.length
    &&!confirm("Das vorhandene Profil wird durch die erkannte Form ersetzt. Fortfahren?"))return false;
 const anzahl=erkanntesProfil.length;
 aufnahme.schenkel=erkanntesProfil.map(s=>({...s}));
 vorschauSchliessen();
 erkennungStatus="✓ "+anzahl+" Schenkel übernommen. Bitte Längen und Winkel prüfen und mit den tatsächlichen Massen ergänzen.";
 return true;
}

function alleAufnahmen(){
 try{const l=JSON.parse(localStorage.getItem(SPEICHER)||"[]");return Array.isArray(l)?l:[]}
 catch(e){return []}
}
function speichern(){
 const jetzt=new Date().toISOString();
 // Der Zuschnittplan wird mitgespeichert, damit ein spaeter gedrucktes Blatt
 // gleich bleibt, auch wenn die Rollenbreiten sich aendern - gleiches
 // Vorgehen wie beim Einlaufblech.
 aufnahme.zuschnitt=zuschnittSnapshot();
 const liste=alleAufnahmen();
 if(!aufnahme.id){
  aufnahme.id="fp"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  aufnahme.erstellt=jetzt;
  liste.unshift(JSON.parse(JSON.stringify(aufnahme)));
 }else{
  aufnahme.geaendert=jetzt;
  const i=liste.findIndex(x=>x.id===aufnahme.id);
  const kopie=JSON.parse(JSON.stringify(aufnahme));
  if(i>=0)liste[i]=kopie; else liste.unshift(kopie);
 }
 try{localStorage.setItem(SPEICHER,JSON.stringify(liste))}catch(e){
  alert("Der Speicher des Browsers ist voll. Bitte alte Aufnahmen oder Fotos löschen.");
  return false;
 }
 return true;
}
function oeffnen(id){
 const a=alleAufnahmen().find(x=>x.id===id);
 if(!a)return false;
 aufnahme=JSON.parse(JSON.stringify({...leereAufnahme(),...a}));
 // Ältere Datensätze können Felder noch nicht kennen - Standard gilt, es
 // wird nichts erfunden.
 if(!Array.isArray(aufnahme.schenkel))aufnahme.schenkel=[];
 if(!Array.isArray(aufnahme.segmente))aufnahme.segmente=[];
 if(!Array.isArray(aufnahme.fotos))aufnahme.fotos=[];
 vorschauSchliessen(); erkennungStatus="";
 schritt=1; zeichne(); return true;
}
// Kopieren erzeugt einen eigenständigen Datensatz: eigene Kennung, tiefe
// Kopie. Eine Änderung an der Kopie lässt das Original unberührt.
function kopieren(id){
 const a=alleAufnahmen().find(x=>x.id===id);
 if(!a)return false;
 const k=JSON.parse(JSON.stringify(a));
 k.id="fp"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
 k.erstellt=new Date().toISOString(); k.geaendert=null;
 k.bezeichnung=(a.bezeichnung||"Ohne Bezeichnung")+" (Kopie)";
 const liste=alleAufnahmen(); liste.unshift(k);
 localStorage.setItem(SPEICHER,JSON.stringify(liste));
 aufnahme=JSON.parse(JSON.stringify({...leereAufnahme(),...k}));
 schritt=1; zeichne(); return k.id;
}
function loeschen(id){
 localStorage.setItem(SPEICHER,JSON.stringify(alleAufnahmen().filter(x=>x.id!==id)));
}

${mm(p.gruppen[0].breite)} mm.</div>`;

 const hinweise=(p.ohne.length?`<div class="p-warnung">${p.ohne.length} Segment(e) ohne Länge oder
ohne Masse werden nicht gerechnet: Nummer ${p.ohne.map(x=>x.nr).join(", ")}.</div>`:"")
 +(p.zuSchmal.length?`<div class="p-klein-text">Zu schmal für dieses Profil: ${
   p.zuSchmal.map(b=>mm(b)+" mm").join(", ")}.</div>`:"")
 +(p.optimal===false?`<div class="p-warnung">Bei dieser Stückzahl wurde nicht jede Möglichkeit
durchgerechnet – das ist die beste GEFUNDENE Verteilung, nicht nachweislich die beste.</div>`:"");

 return karte("6 · Zuschnitt aus Rollenblech",auswahl)
 +karte("Was zugeschnitten wird",gruppen
  +`<div class="p-klein-text">Segmente mit gleicher Streifenbreite werden zusammen gepackt.
${istKonisch()?"Konisch: die Streifenbreite ist die grössere der beiden Abwicklungen – der Zuschnitt muss das breitere Ende enthalten.":"Die Streifenbreite ist die Abwicklung des Segments."}</div>`
  +streifen)
 +karte("Rollenbreite und Verschnitt",plan+hinweise);
}

// 7 · Kontrolle
function schritt7(){
 const m=pruefungen();
 if(!m.length)return karte("7 · Kontrolle",
  `<div class="p-ok">Keine Auffälligkeit. Alles, was zum Speichern nötig ist, liegt vor.</div>`);
 const a=aufnahme;
 const uebersicht=`<div class="p-tabelle-scroll">
<table class="p-tabelle"><tbody>
<tr><td>Bezeichnung</td><td>${esc(a.bezeichnung||"–")}</td></tr>
<tr><td>Material</td><td>${esc((findMeasurementMaterial(a.material)||{}).name||"–")}</td></tr>
<tr><td>Schenkel</td><td>${a.schenkel.length}</td></tr>
<tr><td>Segmente</td><td>${(a.segmente||[]).length}</td></tr>
<tr><td>Fotos / Skizze</td><td>${(a.fotos||[]).length} Foto(s)${a.skizze?" · Skizze vorhanden":""}</td></tr>
</tbody></table></div>`;
 return karte("7 · Kontrolle",uebersicht+`<div class="p-pruefung">`+m.map(x=>
  `<div class="p-${x.art==="fehler"?"fehler":"warnung"}">${esc(x.text)}</div>`).join("")+`</div>
<div id="p-profilKontrolle" class="p-zeichnung">${profilSvg(a.schenkel)}</div>`);
}

// 8 · Fotos, Skizze, Notiz, Speichern
function schritt8(){
 const a=aufnahme;
 const fotos=(a.fotos||[]).map((f,i)=>`<div class="p-foto">
<img src="${esc(f)}" alt="Foto ${i+1}"><button type="button" class="p-weg" data-foto-weg="${i}">✕</button></div>`).join("");
 return karte("8 · Fotos",`<label class="p-datei">📷 Foto aufnehmen oder wählen
<input type="file" id="p-fotoInput" accept="image/*" capture="environment" multiple hidden></label>
<div class="p-fotos">${fotos||'<div class="p-leer">Noch kein Foto.</div>'}</div>
<div class="p-klein-text">Fotos werden verkleinert im Browser abgelegt. Beim späteren Einbau in
die App gehen sie wie gehabt in den privaten Speicher von Supabase, zugeordnet zu Projekt und
Massaufnahme.</div>`)
+karte("Skizze",`${a.skizze
 ?`<div class="p-foto gross"><img src="${esc(a.skizze)}" alt="Skizze"><button type="button" class="p-weg" id="p-skizzeWeg">✕</button></div>`
 :'<div class="p-leer">Noch keine Skizze.</div>'}
<div class="p-knopfreihe"><button type="button" class="p-blau" id="p-skizzeOeffnen">✏️ ${a.skizze?"Skizze bearbeiten":"Skizze zeichnen"}</button></div>
<div class="p-skizzeBox" id="p-skizzeBox" hidden>
<canvas id="p-skizzeCanvas"></canvas>
<div class="p-knopfreihe">
<button type="button" class="p-blau" id="p-skizzeSpeichern">✓ Übernehmen</button>
<button type="button" class="p-grau" id="p-skizzeLeeren">Leeren</button>
<button type="button" class="p-grau" id="p-skizzeAbbrechen">Abbrechen</button>
</div></div>`)
+karte("Bemerkung und Speichern",`<textarea id="p-bemerkung" rows="4" placeholder="Bemerkung zur Massaufnahme">${esc(a.bemerkung||"")}</textarea>
<div class="p-knopfreihe"><button type="button" class="p-gruen" id="p-speichern2">💾 Speichern</button></div>`);
}

function inhaltHtml(){
 return [schritt1,schritt2,schritt3,schritt4,schritt5,schritt6,schritt7,schritt8][schritt-1]();
}

// ---- 10. Liste ------------------------------------------------------------
let listeOffen=false;
function listeHtml(){
 const liste=alleAufnahmen();
 if(!liste.length)return '<div class="p-leer">Noch keine gespeicherte Massaufnahme.</div>';
 return liste.map(a=>{
  const d=new Date(a.geaendert||a.erstellt);
  const datum=isNaN(d)?"":d.toLocaleDateString("de-CH")+" "+d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
  return `<div class="p-zeile">
<div class="p-zeile-kopf"><b>${esc(a.bezeichnung||"Ohne Bezeichnung")}</b><span class="p-klein-text">${esc(datum)}</span></div>
<div class="p-klein-text">${(a.schenkel||[]).length} Schenkel · ${(a.segmente||[]).length} Segment(e)${(a.fotos||[]).length?" · "+a.fotos.length+" Foto(s)":""}${a.skizze?" · Skizze":""}${a.id===aufnahme.id?" · <b>gerade offen</b>":""}</div>
<div class="p-knopfreihe">
<button type="button" class="p-blau" data-oeffnen="${esc(a.id)}">Öffnen</button>
<button type="button" class="p-grau" data-kopieren="${esc(a.id)}">Kopieren</button>
<button type="button" class="p-grau" data-loeschen="${esc(a.id)}">Löschen</button>
</div></div>`;
 }).join("");
}

// ---- 11. Zeichnen ---------------------------------------------------------
function zeichne(){
 const reg=$("p-registerBox"); if(reg)reg.innerHTML=registerHtml();
 const inhalt=$("p-inhalt"); if(inhalt)inhalt.innerHTML=inhaltHtml();
 const zurueck=$("p-zurueck"), weiter=$("p-weiter");
 if(zurueck)zurueck.disabled=schritt<=1;
 if(weiter){
  weiter.disabled=false;
  weiter.textContent=schritt>=SCHRITTE.length?"Fertig › Speichern":"Weiter › "+SCHRITTE[schritt];
 }
 const listeBox=$("p-listeBox");
 if(listeBox){listeBox.hidden=!listeOffen; if(listeOffen)listeBox.innerHTML=listeHtml()}
 // Das aktive Register muss in der seitwärts scrollenden Leiste sichtbar sein.
 const strip=$("p-register"), aktiv=strip&&strip.querySelector(".p-register-knopf.aktiv");
 if(strip&&aktiv){
  const sr=strip.getBoundingClientRect(), ar=aktiv.getBoundingClientRect();
  if(ar.left<sr.left)strip.scrollLeft-=(sr.left-ar.left)+12;
  else if(ar.right>sr.right)strip.scrollLeft+=(ar.right-sr.right)+12;
 }
}
function setzeSchritt(n){
 schritt=Math.max(1,Math.min(SCHRITTE.length,Number(n)||1));
 zeichne();
 const kopf=$("p-registerBox");
 if(kopf&&kopf.scrollIntoView)kopf.scrollIntoView({block:"nearest"});
}
// Nach einer Zifferneingabe wird NICHT alles neu gezeichnet - sonst verliert
// das Feld nach dem ersten Zeichen den Fokus. Aktualisiert werden nur die
// Zeichnung und die abgeleiteten Anzeigen.
function live(){
 const a=aufnahme;
 const svg=profilSvg(a.schenkel);
 const p1=$("p-profilBild"); if(p1)p1.innerHTML=svg;
 const p2=$("p-profilGross"); if(p2)p2.innerHTML=svg;
 const p3=$("p-profilKontrolle"); if(p3)p3.innerHTML=svg;
 // Kopfzeilen der Schenkel mitführen, ohne die Eingabefelder zu ersetzen.
 a.schenkel.forEach((s,i)=>{
  const block=document.querySelector('[data-schenkel-zeile="'+i+'"]');
  if(!block)return;
  const kopf=block.querySelector(".p-zeile-kopf .p-klein-text");
  if(kopf)kopf.textContent=mm(s.laenge)+" mm · "+mm(s.winkel)+"°"
   +(istUmschlagSchenkel(s)?" · Umschlag":"")+(i===0?" · Startschenkel":"");
 });
 // Kopfzeilen der Segmente ebenso.
 (a.segmente||[]).forEach((seg,i)=>{
  const block=document.querySelector('[data-seg-zeile="'+i+'"]');
  if(!block)return;
  const kopf=block.querySelector(".p-zeile-kopf .p-klein-text");
  const ab=abwicklungSegment(seg);
  if(kopf)kopf.textContent="Abwicklung "+(istKonisch()?mm(ab.links)+" / "+mm(ab.rechts):mm(ab.links))
   +" mm · Fläche "+flaecheSegmentM2(seg).toFixed(2).replace(".",",")+" m²";
 });
}

// ---- 12. Fotos und Skizze -------------------------------------------------
const FOTO_MAXKANTE=1400, FOTO_QUALITAET=0.72;
function bildVerkleinern(datei){
 return new Promise(fertig=>{
  const leser=new FileReader();
  leser.onerror=()=>fertig(null);
  leser.onload=()=>{
   const bild=new Image();
   bild.onerror=()=>fertig(null);
   bild.onload=()=>{
    const f=Math.min(1,FOTO_MAXKANTE/Math.max(bild.width,bild.height));
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(bild.width*f));
    c.height=Math.max(1,Math.round(bild.height*f));
    c.getContext("2d").drawImage(bild,0,0,c.width,c.height);
    try{fertig(c.toDataURL("image/jpeg",FOTO_QUALITAET))}catch(e){fertig(null)}
   };
   bild.src=leser.result;
  };
  leser.readAsDataURL(datei);
 });
}
async function fotosAufnehmen(dateien){
 for(const d of Array.from(dateien||[])){
  const bild=await bildVerkleinern(d);
  if(bild)aufnahme.fotos.push(bild);
 }
 zeichne();
}
let skizzeCtx=null, skizzeZeichnet=false;
function skizzeOeffnen(){
 const box=$("p-skizzeBox"), c=$("p-skizzeCanvas");
 if(!box||!c)return;
 box.hidden=false;
 const b=c.getBoundingClientRect();
 c.width=Math.max(320,Math.round(b.width||480));
 c.height=Math.round(c.width*0.62);
 skizzeCtx=c.getContext("2d");
 skizzeCtx.fillStyle="#fff"; skizzeCtx.fillRect(0,0,c.width,c.height);
 skizzeCtx.strokeStyle="#17202a"; skizzeCtx.lineWidth=3;
 skizzeCtx.lineCap="round"; skizzeCtx.lineJoin="round";
 // Vorhandene Skizze weiterbearbeiten statt neu anfangen.
 if(aufnahme.skizze){
  const alt=new Image();
  alt.onload=()=>skizzeCtx.drawImage(alt,0,0,c.width,c.height);
  alt.src=aufnahme.skizze;
 }
}
function skizzePunkt(ev,c){
 const b=c.getBoundingClientRect();
 const t=(ev.touches&&ev.touches[0])||ev;
 return [(t.clientX-b.left)*(c.width/b.width),(t.clientY-b.top)*(c.height/b.height)];
}

// ---- 13. Bedienung --------------------------------------------------------
// Eine einzige Stelle je Ereignisart, delegiert von der Wurzel.
// Tippen (input) ändert nur das Modell und die Zeichnung, Auswählen (change)
// und Klicken zeichnen neu.
function verdrahten(){
 const w=$("p-app");
 if(!w||w.dataset.verdrahtet)return;
 w.dataset.verdrahtet="1";

 w.addEventListener("input",e=>{
  const t=e.target, d=t.dataset||{}, a=aufnahme;
  let nurLive=false;
  if(t.id==="p-bezeichnung")a.bezeichnung=t.value;
  else if(t.id==="p-objekt")a.objekt=t.value;
  else if(t.id==="p-bemerkung")a.bemerkung=t.value;
  else if(d.schenkelLaenge!==undefined){schenkelLaengeSetzen(Number(d.schenkelLaenge),t.value);nurLive=true}
  else if(d.schenkelWinkel!==undefined){
   const s=a.schenkel[Number(d.schenkelWinkel)];
   if(s){s.winkel=zahl(t.value);nurLive=true}
  }
  else if(d.segLaenge!==undefined){
   const seg=a.segmente[Number(d.segLaenge)];
   if(seg){seg.laenge=zahl(t.value);nurLive=true}
  }
  else if(d.segMass!==undefined||d.segLinks!==undefined||d.segRechts!==undefined){
   const key=d.segMass??d.segLinks??d.segRechts;
   const [si,sj]=String(key).split("_").map(Number);
   const seg=a.segmente[si];
   if(seg){
    if(!seg.massen)seg.massen=[];
    if(!seg.massen[sj])seg.massen[sj]={mass:0,links:0,rechts:0};
    if(d.segMass!==undefined)seg.massen[sj].mass=zahl(t.value);
    else if(d.segLinks!==undefined)seg.massen[sj].links=zahl(t.value);
    else seg.massen[sj].rechts=zahl(t.value);
    nurLive=true;
   }
  }
  else return;
  if(nurLive)live();
 });

 w.addEventListener("change",e=>{
  const t=e.target, d=t.dataset||{}, a=aufnahme;
  if(t.id==="p-datum"){a.datum=t.value;return}
  if(t.id==="p-material"){a.material=t.value;zeichne();return}
  if(t.id==="p-konisch"){a.konisch=t.value;zeichne();return}
  if(t.id==="p-ansicht"){a.ansicht=t.value;zeichne();return}
  if(t.id==="p-fotoInput"){fotosAufnehmen(t.files);return}
  if(d.rollenbreite!==undefined){
   const b=Number(d.rollenbreite);
   const liste=rollenbreitenGewaehlt().filter(x=>x!==b);
   if(t.checked)liste.push(b);
   rollenbreitenSetzen(liste.sort((x,y)=>y-x));
   zeichne(); return;
  }
 });

 w.addEventListener("click",e=>{
  const t=e.target.closest("button,label,[data-schritt],[data-oeffnen],[data-kopieren],[data-loeschen]");
  if(!t)return;
  const d=t.dataset||{}, a=aufnahme;
  if(d.schritt!==undefined){setzeSchritt(d.schritt);return}
  if(t.id==="p-zurueck"){if(schritt>1)setzeSchritt(schritt-1);return}
  if(t.id==="p-weiter"){
   if(schritt<SCHRITTE.length){setzeSchritt(schritt+1);return}
   if(speichern()){t.textContent="✓ Gespeichert";setTimeout(()=>{t.textContent="Fertig › Speichern"},1400)}
   return;
  }
  if(t.id==="p-speichern"||t.id==="p-speichern2"){
   if(speichern()){const alt=t.textContent;t.textContent="✓ Gespeichert";setTimeout(()=>{t.textContent=alt},1400)}
   return;
  }
  if(t.id==="p-neu"){
   if(confirm("Neue Massaufnahme beginnen? Nicht Gespeichertes geht verloren.")){
    aufnahme=leereAufnahme(); vorschauSchliessen(); erkennungStatus="";
    schritt=1; zeichne();
   }
   return;
  }
  if(t.id==="p-kopieren"){
   if(!kopieren(aufnahme.id)){
    alert("Diese Massaufnahme ist noch nicht gespeichert. Bitte zuerst speichern.");
    return;
   }
   alert("Kopie angelegt: „"+(aufnahme.bezeichnung||"Ohne Bezeichnung")
     +"“. Sie ist von der ursprünglichen Aufnahme unabhängig.");
   return;
  }
  if(t.id==="p-listeAuf"){listeOffen=!listeOffen;zeichne();return}
  if(d.oeffnen!==undefined){oeffnen(d.oeffnen);return}
  if(d.kopieren!==undefined){kopieren(d.kopieren);return}
  if(d.loeschen!==undefined){
   if(confirm("Diese gespeicherte Massaufnahme wirklich löschen?")){loeschen(d.loeschen);zeichne()}
   return;
  }
  // ---- Schenkel
  if(t.id==="p-schenkelPlus"){
   if(a.schenkel.length>=FP_MAX_SCHENKEL){
    alert("Mehr als "+FP_MAX_SCHENKEL+" Schenkel lässt die App nicht zu.");return;
   }
   a.schenkel.push(neuerSchenkel()); zeichne(); return;
  }
  if(d.schenkelWeg!==undefined){
   a.schenkel.splice(Number(d.schenkelWeg),1);
   // Die Masse der Segmente wandern mit, damit Schenkel und Mass zusammenbleiben.
   (a.segmente||[]).forEach(seg=>{if(seg.massen)seg.massen.splice(Number(d.schenkelWeg),1)});
   zeichne(); return;
  }
  if(d.schenkelFlip!==undefined){schenkelUmkehren(Number(d.schenkelFlip)); zeichne(); return}
  if(d.schenkelUmschlag!==undefined){schenkelUmschlag(Number(d.schenkelUmschlag)); zeichne(); return}
  if(d.schenkelHoch!==undefined){
   const i=Number(d.schenkelHoch);
   if(i>0){
    const x=a.schenkel.splice(i,1)[0]; a.schenkel.splice(i-1,0,x);
    (a.segmente||[]).forEach(seg=>{if(seg.massen){const y=seg.massen.splice(i,1)[0];seg.massen.splice(i-1,0,y)}});
   }
   zeichne(); return;
  }
  if(d.schenkelRunter!==undefined){
   const i=Number(d.schenkelRunter);
   if(i<a.schenkel.length-1){
    const x=a.schenkel.splice(i,1)[0]; a.schenkel.splice(i+1,0,x);
    (a.segmente||[]).forEach(seg=>{if(seg.massen){const y=seg.massen.splice(i,1)[0];seg.massen.splice(i+1,0,y)}});
   }
   zeichne(); return;
  }
  // ---- Segmente
  if(t.id==="p-segmentPlus"){a.segmente.push(neuesSegment()); zeichne(); return}
  if(d.segWeg!==undefined){a.segmente.splice(Number(d.segWeg),1); zeichne(); return}
  if(d.segUebernehmen!==undefined){masseAusProfil(Number(d.segUebernehmen)); zeichne(); return}
  if(d.segAlleRechts!==undefined){alleNachRechts(Number(d.segAlleRechts)); zeichne(); return}
  if(d.segNachRechts!==undefined){
   const [si,sj]=String(d.segNachRechts).split("_").map(Number);
   const seg=a.segmente[si];
   if(seg&&segmentMassen(seg)[sj]){seg.massen[sj].rechts=zahl(seg.massen[sj].links)}
   zeichne(); return;
  }
  // ---- Skizzen-Erkennung
  if(t.id==="p-erkennen"){erkennungStarten(); return}
  if(t.id==="p-erkanntUebernehmen"){
   if(erkanntesUebernehmen())zeichne();
   return;
  }
  if(t.id==="p-erkanntVerwerfen"){
   vorschauSchliessen();
   erkennungStatus="Erkannte Form verworfen. Das bestehende Profil bleibt unverändert.";
   zeichne(); return;
  }
  if(t.id==="p-zuFotos"){setzeSchritt(7); return}
  // ---- Fotos und Skizze
  if(d.fotoWeg!==undefined){a.fotos.splice(Number(d.fotoWeg),1); zeichne(); return}
  if(t.id==="p-skizzeWeg"){a.skizze=null; zeichne(); return}
  if(t.id==="p-skizzeOeffnen"){skizzeOeffnen(); return}
  if(t.id==="p-skizzeLeeren"){
   const c=$("p-skizzeCanvas");
   if(c&&skizzeCtx){skizzeCtx.fillStyle="#fff";skizzeCtx.fillRect(0,0,c.width,c.height);skizzeCtx.strokeStyle="#17202a"}
   return;
  }
  if(t.id==="p-skizzeAbbrechen"){const b=$("p-skizzeBox"); if(b)b.hidden=true; return}
  if(t.id==="p-skizzeSpeichern"){
   const c=$("p-skizzeCanvas");
   if(c){try{a.skizze=c.toDataURL("image/png")}catch(err){}}
   const b=$("p-skizzeBox"); if(b)b.hidden=true;
   zeichne(); return;
  }
 });

 // Skizze zeichnen - Maus und Finger.
 const start=ev=>{
  const c=$("p-skizzeCanvas");
  if(!c||!skizzeCtx||ev.target!==c)return;
  ev.preventDefault();
  skizzeZeichnet=true;
  const [x,y]=skizzePunkt(ev,c);
  skizzeCtx.beginPath(); skizzeCtx.moveTo(x,y);
 };
 const zug=ev=>{
  const c=$("p-skizzeCanvas");
  if(!skizzeZeichnet||!c||!skizzeCtx)return;
  ev.preventDefault();
  const [x,y]=skizzePunkt(ev,c);
  skizzeCtx.lineTo(x,y); skizzeCtx.stroke();
 };
 const stopp=()=>{skizzeZeichnet=false};
 w.addEventListener("mousedown",start); w.addEventListener("touchstart",start,{passive:false});
 w.addEventListener("mousemove",zug);   w.addEventListener("touchmove",zug,{passive:false});
 w.addEventListener("mouseup",stopp);   w.addEventListener("touchend",stopp);
 w.addEventListener("mouseleave",stopp);
}

// ---- 14. Start ------------------------------------------------------------
if(typeof document!=="undefined"&&document.addEventListener){
 document.addEventListener("DOMContentLoaded",()=>{verdrahten();zeichne()});
 if(document.readyState!=="loading"){verdrahten();zeichne()}
}

</script>
